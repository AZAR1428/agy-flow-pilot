    }
    if (sub.running) {
      node.style.display = "inline-flex";
      node.classList.add("empty");
      setTextIfChanged(node, "执行中");
    } else {
      node.style.display = "none";
      setTextIfChanged(node, "");
    }
  }

  function buildDrawerHtml(mode, t) {
    if (mode === "ctx") {
      const over = t.used - t.max;
      let remHtml = over > 0
        ? `超限：<strong>+${fmtK(over)}</strong>`
        : `余量：<strong>${fmtK(Math.max(0, t.max - t.used))}</strong>`;
      if (t.compactionCount > 0) {
        remHtml += ` · 已压缩 <strong>${t.compactionCount}</strong> 次`;
      }
      if (t.estimatedAfterCompaction) {
        remHtml += ` <span class="ctx-est-tag">(压缩后预估)</span>`;
      }
      const routedHtml = (t.routedModelLabel && t.routedModelLabel !== t.modelLabel)
        ? `<span class="drawer-warn">（实际路由：${esc(t.routedModelLabel)}）</span>`
        : "";
      const topChildrenHtml = (Array.isArray(t.topChildren) && t.topChildren.length > 0)
        ? `<div class="drawer-line">膨胀主因：${t.topChildren.slice(0, 4).map((c) => {
            const cname = c.name.length > 18 ? c.name.slice(0, 17) + "…" : c.name;
            return `${esc(cname)} <strong>${fmtK(c.tokens)}</strong>`;
          }).join(" · ")}</div>`
        : "";
      const extHtml = t.groups.ext > 0
        ? `<span class="dot-swatch" style="background:var(--fp-ext)"></span>扩展 <strong>${fmtK(t.groups.ext)}</strong> · `
        : "";
      const tu = t.tokenUsage;
      const cumCacheStr = tu.hasCacheData ? `${tu.cacheHitPct.toFixed(1)}%` : "--";
      let lastTurnCacheHtml = "<strong>--</strong>";
      if (tu.lastTurnCacheHitPct !== null && tu.lastTurnCacheHitPct !== undefined) {
        const pctStr = fmtPctCompact(tu.lastTurnCacheHitPct);
        const showUncached = tu.lastTurnInputTokens > 0 && (tu.lastTurnCacheHitPct < 50 || tu.lastTurnInputTokens >= 40000);
        const uncachedNote = showUncached ? `（重算 ${fmtTok(tu.lastTurnInputTokens)}）` : "";
        const isColdTurn = tu.lastTurnCacheHitPct < 10 && tu.lastTurnInputTokens >= 40000;
        lastTurnCacheHtml = isColdTurn
          ? `<strong class="drawer-warn">${pctStr}${uncachedNote}</strong>`
          : `<strong>${pctStr}${uncachedNote}</strong>`;
        if (tu.cacheMissStreak >= 2) {
          lastTurnCacheHtml += ` · <span class="drawer-warn">连续未命中 ${tu.cacheMissStreak} 轮</span>`;
        }
      }
      return (
        `<div class="drawer-head"><span class="drawer-line">模型：<strong>${esc(t.modelLabel)}</strong>${routedHtml}</span><span class="drawer-line">${remHtml}</span></div>` +
        `<div class="drawer-line">` +
          `<span class="dot-swatch" style="background:var(--fp-sys)"></span>系统 <strong>${fmtK(t.groups.sys)}</strong> · ` +
          extHtml +
          `<span class="dot-swatch" style="background:var(--fp-tool)"></span>工具 <strong>${fmtK(t.groups.tools)}</strong> · ` +
          `<span class="dot-swatch" style="background:var(--fp-chat)"></span>对话 <strong>${fmtK(t.groups.chat)}</strong>` +
        `</div>` +
        topChildrenHtml +
        `<div class="drawer-line drawer-sep">累计消耗：<strong>${fmtTok(tu.netTokens)}</strong>（输入 <strong>${fmtTok(tu.inputTokens)}</strong> · 输出 <strong>${fmtTok(tu.outputTokens)}</strong>${tu.subNetTokens > 0 ? ` · 含子代理 <strong>${fmtTok(tu.subNetTokens)}</strong>` : ""}）</div>` +
        `<div class="drawer-line">累计缓存命中：<strong>${cumCacheStr}</strong></div>` +
        `<div class="drawer-line">上轮缓存命中：${lastTurnCacheHtml}</div>`
      );
    }
    if (mode === "speed") {
      const ts = t.tokenSpeed;
      const hbState = String((t.hb && t.hb.state) || "").toLowerCase();
      const bgScript = t.hb && t.hb.bgScript;
      const bgPrefix = bgScript ? (bgScript.kind === "workflow" ? "⚙ 工作流" : "⚙ 后台脚本") : "";
      const bgStartedSec = bgScript
        ? (bgScript.startedAt > 0 ? Math.max(0, (Date.now() / 1000) - bgScript.startedAt) : bgScript.elapsedSec)
        : 0;
      const bgStepIdxStr = bgScript && Number.isFinite(bgScript.stepIndex) ? `步骤 ${bgScript.stepIndex}` : "步骤 --";
      if (bgScript && hbState === "running_bg_script" && !ts.active && t.swarmSummary.runningCount <= 0) {
        return (
          `<div class="drawer-head"><span class="drawer-line">状态：<strong>${bgPrefix}运行中</strong></span><span class="drawer-line">已运行：<strong>${fmtElapsed(bgStartedSec)}</strong></span></div>` +
          `<div class="drawer-line">工具：<strong>${esc(bgScript.toolName || "--")}</strong>（${bgStepIdxStr}）</div>` +
          `<div class="drawer-line">主回复已结束，后台进程仍在执行</div>`
        );
      }
      const peak = ts.peakTokensPerSec > 0 ? `${fmtRate(ts.peakTokensPerSec)} tok/s` : "--";
      const avg = ts.avgTokensPerSec > 0 ? `${fmtRate(ts.avgTokensPerSec)} tok/s` : "--";
      const ttftOrWait = (ts.active && ts.phase === "waiting_ttft" && ts.elapsedGenSec > 0)
        ? `已等待：<strong>${fmtElapsed(ts.elapsedGenSec)}</strong>`
        : `首字：<strong>${fmtTtft(ts.ttftMs)}</strong>`;
      const phaseText = (!ts.active && hbState === "waiting_approval")
        ? "等待用户审批"
        : `${ts.phaseLabel}${ts.isExact ? " (精确)" : ""}`;
      const fgToolHtml = (!ts.active && t.hb && t.hb.isRunning && t.hb.runningStepIndex >= 0 && t.hb.toolName)
        ? `<div class="drawer-line drawer-sep">当前工具：<strong>${esc(t.hb.toolName)}</strong>（步骤 ${t.hb.runningStepIndex} · 已运行 <strong>${fmtElapsed(t.hb.elapsedSec)}</strong>）</div>`
        : "";
      const showBgConcurrent = Boolean(bgScript && !(t.hb && t.hb.runningStepIndex >= 0 && bgScript.stepIndex === t.hb.runningStepIndex));
      const bgConcurrentHtml = showBgConcurrent
        ? `<div class="drawer-line${fgToolHtml ? "" : " drawer-sep"}">${bgPrefix}：<strong>${esc(bgScript.toolName || "--")}</strong>（${bgStepIdxStr} · 已运行 <strong>${fmtElapsed(bgStartedSec)}</strong>${bgScript.isStalled ? ` · <span class="drawer-warn">已挂起</span>` : ""}）</div>`
        : "";
      return (
        `<div class="drawer-head"><span class="drawer-line">阶段：<strong>${esc(phaseText)}</strong></span><span class="drawer-line">${ttftOrWait}</span></div>` +
        `<div class="drawer-line">输出：<strong>${ts.outputTokens} tok</strong>（思考 ${ts.thinkingTokens} · 回复 ${ts.responseTokens}）</div>` +
        `<div class="drawer-line">峰值：<strong>${peak}</strong> · 均值：<strong>${avg}</strong></div>` +
        fgToolHtml +
        bgConcurrentHtml
      );
    }
    if (mode === "alert") {
      const parts = [];
      if (t.hb.hasAlert || t.hb.isStalled) {
        const ra = t.hb.retryAlert;
        const stLow = String(t.hb.state || "").toLowerCase();
        const meta = [];
        if (stLow === "retrying") {
          const att = ra ? (ra.attempt > 0 ? ra.attempt : ra.consecutiveErrors) : 0;
          meta.push(att > 0 ? `重试第 ${att} 次` : "连接重试中");
        } else if (stLow === "interrupted") {
          meta.push(ra && ra.isTimeout ? "超时中断" : "断流中断");
        } else if (stLow === "error") {
          meta.push("异常中断");
        }
        if (ra && ra.consecutiveErrors >= 2) {
          meta.push(`连续异常 ${ra.consecutiveErrors} 次`);
        }
        if (ra && ra.ageSec !== null && ra.ageSec !== undefined) {
          meta.push(`距今 ${fmtElapsed(ra.ageSec)}`);
        }
        if (meta.length > 0) {
          parts.push(`<div class="drawer-line"><strong>${esc(meta.join(" · "))}</strong></div>`);
        }
        const bgStallStepNote = (t.hb.isStalled && t.hb.bgScript && t.hb.bgScript.isStalled && t.hb.bgScript.stepIndex !== null)
          ? `（步骤 ${t.hb.bgScript.stepIndex}）`
          : "";
        const msg = t.hb.alertMsg || (t.hb.isStalled ? (t.hb.toolName ? `${t.hb.toolName} 已超阈值挂起${bgStallStepNote}` : `响应超阈值挂起${bgStallStepNote}`) : (meta.length > 0 ? "" : "运行异常待处理"));
        if (msg) {
          parts.push(`<div class="drawer-err">${esc(msg)}</div>`);
        }
      }
      return parts.join("");
    }
    return "";
  }

  /* ---------- Keyed Task Card Creation & Fine-Grained DOM Patch ---------- */
  function createCardRecord(taskKey) {
    const root = el("taskCardTpl").content.firstElementChild.cloneNode(true);
    const q = (role) => root.querySelector(`[data-role="${role}"]`);
    const refs = {
      root,
      titleWrap: q("titleWrap"),
      wsBadge: q("wsBadge"),
      title: q("title"),
      modelBadge: q("modelBadge"),
      branchBadge: q("branchBadge"),
      usageChip: q("usageChip"),
      pinBtn: q("pinBtn"),
      hideRecentBtn: q("hideRecentBtn"),
      ctxReadout: q("ctxReadout"),
      ctxPct: q("ctxPct"),
      ctxTok: q("ctxTok"),
      speedBadge: q("speedBadge"),
      barHit: q("barHit"),
      barTrack: q("barTrack"),
      segSys: q("segSys"),
      segExt: q("segExt"),
      segTools: q("segTools"),
      segChat: q("segChat"),
      drawerWrap: q("drawerWrap"),
      drawerBox: q("drawerBox"),
      stepRow: q("stepRow"),
      stepWarnIcon: q("stepWarnIcon"),
      stepDot: q("stepDot"),
      stepLabel: q("stepLabel"),
      stepTimerWrap: q("stepTimerWrap"),
      stepElapsed: q("stepElapsed"),
      wakeBtn: q("wakeBtn"),
      cancelBtn: q("cancelBtn"),
      stepHint: q("stepHint"),
      subSection: q("subSection"),
      swarmBar: q("swarmBar"),
      swarmLeft: q("swarmLeft"),
      swarmSpeed: q("swarmSpeed"),
      swarmChevron: q("swarmChevron"),
      subList: q("subList"),
    };

    const rec = {
      taskKey,
      refs,
      task: null,
      drawerMode: "",
      swarmExpanded: true,
      swarmUserToggled: false,
      openSubIds: new Set(),
      subNodes: new Map(),
      hintText: "",
      hintExpiresAt: 0,
      hintTimerId: null,
    };

    const toggleDrawer = (mode) => {
      rec.drawerMode = rec.drawerMode === mode ? "" : mode;
      renderCardDrawer(rec);
      scheduleHudResize();
      setTimeout(() => scheduleHudResize(), 170);
      if (rec.drawerMode) {
        setTimeout(() => {
          const sc = el("stackScroll");
          if (refs.drawerWrap.isConnected && sc && sc.scrollHeight > sc.clientHeight + 2) {
            refs.drawerWrap.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        }, 90);
      }
    };

    refs.drawerWrap.addEventListener("transitionend", () => {
      scheduleHudResize();
    });

    refs.titleWrap.addEventListener("click", () => {
      if (!isHudMode && rec.task && rec.task.cid && window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "toggle-conversation", payload: { conversationId: rec.task.cid } }, "*");
      }
    });
    refs.pinBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (rec.task) togglePinConversation(rec.task.cid);
    });
    refs.hideRecentBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (rec.task) {
        if (archivedRecentKeys.size > 128) archivedRecentKeys.delete(archivedRecentKeys.values().next().value);
        archivedRecentKeys.add(`${rec.task.taskKey}:${rec.task.justFinishedAt}`);
        if (lastFullPayload) renderMultiTasks(lastFullPayload, { localOnlyPrefs: true });
        apiFetch("/api/hud", {
          method: "POST",
          body: JSON.stringify({ action: "dismiss_recent", conversationId: rec.task.cid }),
        }).catch(() => {});
      }
    });

    refs.barHit.addEventListener("click", () => toggleDrawer("ctx"));
    refs.usageChip.addEventListener("click", () => toggleDrawer("ctx"));
    refs.speedBadge.addEventListener("click", () => toggleDrawer("speed"));

    refs.stepRow.addEventListener("click", (e) => {
      if (e.target instanceof Element && e.target.closest("button")) return;
      if (rec.task && (rec.task.hb.hasAlert || rec.task.hb.isStalled)) toggleDrawer("alert");
    });

    const clearStepHint = () => {
      if (rec.hintTimerId !== null) {
        clearTimeout(rec.hintTimerId);
        rec.hintTimerId = null;
      }
      const hadHint = Boolean(rec.hintText || refs.stepHint.classList.contains("visible"));
      rec.hintText = "";
      rec.hintExpiresAt = 0;
      refs.stepHint.classList.remove("visible");
      refs.stepHint.style.display = "none";
      setTextIfChanged(refs.stepHint, "");
      if (hadHint) scheduleHudResize();
    };

    const showStepHint = (msg, durationMs = 5500) => {
      const clean = String(msg || "").trim();
      if (!clean) {
        clearStepHint();
        return;
      }
      if (rec.hintTimerId !== null) clearTimeout(rec.hintTimerId);
      rec.hintText = clean;
      rec.hintExpiresAt = Date.now() + durationMs;
      setTextIfChanged(refs.stepHint, clean);
      refs.stepHint.classList.add("visible");
      refs.stepHint.style.display = "block";
      scheduleHudResize();
      rec.hintTimerId = setTimeout(() => {
        rec.hintTimerId = null;
        clearStepHint();
      }, durationMs);
    };

    rec.clearStepHint = clearStepHint;
    rec.showStepHint = showStepHint;

    const bindRescue = (btn, buildPayload) => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!rec.task || btn.disabled) return;
        const origLabel = btn.textContent;
        btn.disabled = true;
        btn.textContent = "处理中…";
        const extra = buildPayload(rec.task);
        const payload = { lsInstanceId: rec.task.lsInstanceId, conversationId: rec.task.cid, ...extra };
        try {
          const res = await apiFetch("/api/heal", { method: "POST", body: JSON.stringify(payload) });
          if (res && res.ok === false) {
            if (res.error === "already_running") {
              showStepHint("仍在运行/重试中，请先点击中断步骤");
            } else if (res.message || res.error) {
              showStepHint(String(res.message || res.error), 4500);
            }
          } else {
            clearStepHint();
            if (payload.mode === "wake") fastPollBoostUntil = Date.now() + 2600;
          }
          pollNow(true);
        } catch (err) {
          const errData = err && err.data && typeof err.data === "object" ? err.data : null;
          if (
            (err && err.status === 409) ||
            (errData && errData.error === "already_running") ||
            String((err && err.message) || "") === "already_running"
          ) {
            showStepHint("仍在运行/重试中，请先点击中断步骤");
          } else if (err && err.message) {
            showStepHint(`操作失败：${err.message}`, 4000);
          }
        } finally {
          setTimeout(() => {
            btn.disabled = false;
            if (btn === refs.cancelBtn && rec.task) {
              const curHb = rec.task.hb;
              const curBgStall = Boolean(!curHb.hasAlert && curHb.isStalled && curHb.runningStepIndex < 0 && curHb.bgScript && curHb.bgScript.isStalled);
              btn.textContent = curBgStall ? "终止后台" : "⏹ 中断步骤";
            } else {
              btn.textContent = origLabel;
            }
          }, 550);
        }
      });
    };

    bindRescue(refs.wakeBtn, () => ({ mode: "wake" }));
    bindRescue(refs.cancelBtn, (t) => {
      if (t.hb.hasAlert && String(t.hb.state || "").toLowerCase() === "retrying") {
        return { mode: "cancel_invocation" };
      }
      if (t.hb.runningStepIndex >= 0) {
        return { mode: "cancel_step", stepIndex: t.hb.runningStepIndex };
      }
      if (t.hb.isStalled && t.hb.bgScript && t.hb.bgScript.isStalled) {
        if (t.hb.bgScript.stepIndex !== null && t.hb.bgScript.stepIndex >= 0) {
          return { mode: "cancel_step", stepIndex: t.hb.bgScript.stepIndex, killBackgroundTasks: true };
        }
        return { mode: "cancel_invocation", killBackgroundTasks: true };
      }
      return { mode: "cancel_invocation" };
    });

    refs.swarmBar.addEventListener("click", () => {
      rec.swarmUserToggled = true;
      rec.swarmExpanded = !rec.swarmExpanded;
      if (rec.task) renderCardSubagents(rec);
      syncTickTimer();
      scheduleHudResize();
      if (rec.swarmExpanded) {
        setTimeout(() => {
          const sc = el("stackScroll");
          if (refs.subSection.isConnected && sc && sc.scrollHeight > sc.clientHeight + 2) {
            refs.subSection.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        }, 90);
      }
    });

    return rec;
  }

  function renderCardRow2Text(rec) {
    const t = rec.task;
    if (!t) return;
    const { ctxReadout, ctxPct, ctxTok, speedBadge } = rec.refs;
    const hbState = String((t.hb && t.hb.state) || "").toLowerCase();

    ctxPct.style.display = "inline";
    ctxTok.style.display = "inline";
    ctxReadout.className = "ctx-readout" + (t.pct >= 90 ? " crit" : t.pct >= 75 ? " warn" : "");
    setTextIfChanged(ctxPct, `${t.pct.toFixed(1)}%`);
    setTextIfChanged(ctxTok, `${fmtK(t.used)} / ${fmtK(t.max)}`);
    applyCardRow2Speed(speedBadge, t);
    const speedTimerKey = `speed:${rec.taskKey}`;
    if (t.tokenSpeed.active && t.tokenSpeed.displayTokensPerSec <= 0) {
      const phaseLbl = t.tokenSpeed.phase === "waiting_ttft" ? "等待首字" : (t.tokenSpeed.phaseLabel || "生成中");
      timerRegistry.set(speedTimerKey, {
        el: speedBadge,
        baseSec: t.tokenSpeed.elapsedGenSec,
        syncedAtMs: performance.now(),
        format: (sec) => (sec >= 5 ? `⚡ ${phaseLbl} ${fmtElapsed(sec)} ▾` : `⚡ ${phaseLbl} ▾`),
      });
    } else if (!t.tokenSpeed.active && hbState === "waiting_approval") {
      timerRegistry.delete(speedTimerKey);
    } else if (!t.tokenSpeed.active && isActiveFgRootTool(t)) {
      const shortTool = fmtShortToolName(t.hb.toolName);
      timerRegistry.set(speedTimerKey, {
        el: speedBadge,
        baseSec: num(t.hb.elapsedSec, 0),
        syncedAtMs: performance.now(),
        format: (sec) => (sec >= 1 ? `⚙ ${shortTool} ${fmtElapsed(sec)} ▾` : `⚙ ${shortTool} ▾`),
      });
    } else if (!t.tokenSpeed.active && t.swarmSummary.runningCount > 0) {
      timerRegistry.delete(speedTimerKey);
    } else if (!t.tokenSpeed.active && t.swarmSummary.runningCount <= 0 && hbState === "running_bg_script" && t.hb && t.hb.bgScript) {
      const bg = t.hb.bgScript;
      const bgBaseSec = bg.startedAt > 0 ? Math.max(0, (Date.now() / 1000) - bg.startedAt) : bg.elapsedSec;
      const bgPrefix = bg.kind === "workflow" ? "⚙ 工作流" : "⚙ 后台脚本";
      timerRegistry.set(speedTimerKey, {
        el: speedBadge,
        baseSec: bgBaseSec,
        syncedAtMs: performance.now(),
        format: (sec) => (sec >= 1 ? `${bgPrefix} ${fmtElapsed(sec)} ▾` : `${bgPrefix} ▾`),
      });
    } else {
      timerRegistry.delete(speedTimerKey);
    }
  }

  function renderCardDrawer(rec) {
    const t = rec.task;
    const { drawerWrap, drawerBox, barHit } = rec.refs;
    const isCtxOpen = Boolean(t && rec.drawerMode === "ctx");
    if (!t || !rec.drawerMode) {
      drawerWrap.classList.remove("open");
      barHit.classList.remove("open");
      return;
    }
    if (rec.drawerMode === "alert" && !t.hb.hasAlert && !t.hb.isStalled) {
      rec.drawerMode = "";
      drawerWrap.classList.remove("open");
      barHit.classList.remove("open");
      return;
    }
    const html = buildDrawerHtml(rec.drawerMode, t);
    if (!html) {
      drawerWrap.classList.remove("open");
      barHit.classList.remove("open");
      return;
    }
    if (drawerBox.dataset.lastHtml !== html) {
      drawerBox.innerHTML = html;
      drawerBox.dataset.lastHtml = html;
    }
    barHit.classList.toggle("open", isCtxOpen);
    drawerWrap.classList.add("open");
  }

  function createSubRowNode(rec, subCid) {
    const wrap = document.createElement("div");
    wrap.className = "sub-item";
    wrap.dataset.subCid = subCid;
    wrap.innerHTML =
      `<div class="sub-row">` +
        `<div class="sub-left"><span class="sub-dot"></span><span class="sub-name"></span><span class="sub-stage"><span class="sub-stage-lbl"></span><span class="sub-timer-wrap" style="display:none"> · <span class="sub-timer mono-num">0.0s</span></span></span></div>` +
        `<div class="sub-meter"><div class="sub-meter-fill" style="width:0%"></div></div>` +
        `<button class="sub-wake-btn" type="button">⚡ 唤醒</button>` +
        `<span class="speed-badge empty"></span>` +
      `</div>` +
      `<div class="sub-hint" style="display:none;" role="status" aria-live="polite"></div>` +
      `<div class="sub-detail selectable"></div>`;

    const rowEl = wrap.querySelector(".sub-row");
    const dotEl = wrap.querySelector(".sub-dot");
    const nameEl = wrap.querySelector(".sub-name");
    const stageEl = wrap.querySelector(".sub-stage");
    const stageLblEl = wrap.querySelector(".sub-stage-lbl");
    const timerWrapEl = wrap.querySelector(".sub-timer-wrap");
    const timerEl = wrap.querySelector(".sub-timer");
    const meterWrapEl = wrap.querySelector(".sub-meter");
    const meterFillEl = wrap.querySelector(".sub-meter-fill");
    const wakeEl = wrap.querySelector(".sub-wake-btn");
    const spdEl = wrap.querySelector(".speed-badge");
    const hintEl = wrap.querySelector(".sub-hint");
    const detEl = wrap.querySelector(".sub-detail");

    const node = { wrap, rowEl, dotEl, nameEl, stageEl, stageLblEl, timerWrapEl, timerEl, meterWrapEl, meterFillEl, wakeEl, spdEl, hintEl, detEl, hintTimerId: null, sub: null };

    rowEl.addEventListener("click", (e) => {
      if (e.target instanceof Element && e.target.closest("button")) return;
      if (rec.openSubIds.has(subCid)) rec.openSubIds.delete(subCid);
      else rec.openSubIds.add(subCid);
      const isOpen = rec.openSubIds.has(subCid);
      if (isOpen && node.sub) {
        const detHtml = buildSubDetailHtml(node.sub);
        if (detEl.dataset.lastHtml !== detHtml) {
          detEl.innerHTML = detHtml;
          detEl.dataset.lastHtml = detHtml;
        }
      }
      detEl.classList.toggle("open", isOpen);
      scheduleHudResize();
      if (isOpen) {
        setTimeout(() => {
          const sc = el("stackScroll");
          if (detEl.isConnected && sc && sc.scrollHeight > sc.clientHeight + 2) {
            detEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        }, 90);
      }
    });

    wakeEl.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!rec.task || wakeEl.disabled) return;
      wakeEl.disabled = true;
      const isFgStall = Boolean(node.sub && node.sub.isStalled && node.sub.runningStepIndex >= 0);
      const isSubBgStall = Boolean(node.sub && node.sub.isStalled && node.sub.runningStepIndex < 0 && node.sub.bgScript && node.sub.bgScript.isStalled);
      let body;
      if (isFgStall) {
        body = { lsInstanceId: rec.task.lsInstanceId, conversationId: subCid, mode: "cancel_step", stepIndex: node.sub.runningStepIndex };
      } else if (isSubBgStall) {
        const bgIdx = node.sub.bgScript.stepIndex;
        body = (bgIdx !== null && bgIdx >= 0)
          ? { lsInstanceId: rec.task.lsInstanceId, conversationId: subCid, mode: "cancel_step", stepIndex: bgIdx, killBackgroundTasks: true }
          : { lsInstanceId: rec.task.lsInstanceId, conversationId: subCid, mode: "cancel_invocation", killBackgroundTasks: true };
      } else {
        body = { lsInstanceId: rec.task.lsInstanceId, conversationId: subCid, mode: "wake" };
      }
      const showSubHint = (msg, durationMs = 5500) => {
        if (node.hintTimerId !== null) clearTimeout(node.hintTimerId);
        setTextIfChanged(hintEl, msg);
        hintEl.classList.add("visible");
        hintEl.style.display = "block";
        scheduleHudResize();
        node.hintTimerId = setTimeout(() => {
          node.hintTimerId = null;
          hintEl.classList.remove("visible");
          hintEl.style.display = "none";
          setTextIfChanged(hintEl, "");
          scheduleHudResize();
        }, durationMs);
      };
      try {
        const res = await apiFetch("/api/heal", {
          method: "POST",
          body: JSON.stringify(body),
        });
        if (res && res.ok === false) {
          if (res.error === "already_running") {
            showSubHint("仍在运行/重试中，请先点击中断步骤");
          } else if (res.message || res.error) {
            showSubHint(String(res.message || res.error), 4500);
          }
        } else {
          if (node.hintTimerId !== null) { clearTimeout(node.hintTimerId); node.hintTimerId = null; }
          hintEl.classList.remove("visible");
          hintEl.style.display = "none";
          fastPollBoostUntil = Date.now() + 2400;
        }
        pollNow(true);
      } catch (err) {
        const errData = err && err.data && typeof err.data === "object" ? err.data : null;
        if (
          (err && err.status === 409) ||
          (errData && errData.error === "already_running") ||
          String((err && err.message) || "") === "already_running"
        ) {
          showSubHint("仍在运行/重试中，请先点击中断步骤");
        }
      } finally {
        setTimeout(() => { wakeEl.disabled = false; }, 600);
      }
    });

    return node;
  }

  function buildSubDetailHtml(sub) {
    const ts = sub.tokenSpeed;
    const stu = sub.tokenUsage;
    const pkStr = ts.peakTokensPerSec > 0 ? fmtRate(ts.peakTokensPerSec) : "--";
    const avgStr = ts.avgTokensPerSec > 0 ? fmtRate(ts.avgTokensPerSec) : "--";
    let lastCachePart = "";
    if (stu.lastTurnCacheHitPct !== null && stu.lastTurnCacheHitPct !== undefined) {
      const pctStr = fmtPctCompact(stu.lastTurnCacheHitPct);
      const showUncached = stu.lastTurnInputTokens > 0 && (stu.lastTurnCacheHitPct < 50 || stu.lastTurnInputTokens >= 40000);
      const uncachedNote = showUncached ? `（重算 ${fmtTok(stu.lastTurnInputTokens)}）` : "";
      const isCold = stu.lastTurnCacheHitPct < 10 && stu.lastTurnInputTokens >= 40000;
      lastCachePart = ` · 上轮缓存 ${isCold ? `<strong class="drawer-warn">${pctStr}${uncachedNote}</strong>` : `<strong>${pctStr}${uncachedNote}</strong>`}`;
      if (stu.cacheMissStreak >= 2) {
        lastCachePart += ` <span class="drawer-warn">（连续未命中 ${stu.cacheMissStreak} 轮）</span>`;
      }
    }
    const subBgHtml = sub.bgScript
      ? `<div>后台进程: <strong>${esc(sub.bgScript.toolName || "run_command")}</strong>（步骤 ${sub.bgScript.stepIndex !== null ? sub.bgScript.stepIndex : "--"}${sub.bgScript.isStalled ? ` · <span class="drawer-warn">已挂起</span>` : ""}）</div>`
      : "";
    return (
      `模型: <strong>${esc(sub.modelLabel)}</strong> · 上下文: <strong>${sub.context.percent.toFixed(1)}%</strong> (${fmtK(sub.context.used)}/${fmtK(sub.context.max)})` +
      `<div>测速: 峰值 <strong>${pkStr}</strong> / 均值 <strong>${avgStr} tok/s</strong> · 首字 <strong>${fmtTtft(ts.ttftMs)}</strong></div>` +
      `<div>累计消耗: <strong>${fmtTok(stu.netTokens)}</strong>（输入 ${fmtTok(stu.inputTokens)} · 输出 ${fmtTok(stu.outputTokens)}） · 缓存: <strong>${stu.hasCacheData ? stu.cacheHitPct.toFixed(1) + "%" : "--"}</strong>${lastCachePart}</div>` +
      subBgHtml +
      (sub.errorReason ? `<div class="drawer-err">异常: ${esc(sub.errorReason)}</div>` : "")
    );
  }

  function renderCardSubagents(rec) {
    const t = rec.task;
    const { subSection, swarmBar, swarmLeft, swarmSpeed, swarmChevron, subList } = rec.refs;
    const subs = t ? t.subs : [];

    clearTimerPrefix(`sub:${rec.taskKey}:`);

    if (subs.length === 0) {
      subSection.classList.remove("visible");
      return;
    }
    subSection.classList.add("visible");

    const ss = t.swarmSummary;
    if (!rec.swarmUserToggled && (t.bucket === "RUNNING" || t.bucket === "ALERT" || ss.runningCount > 0)) {
      rec.swarmExpanded = true;
    }

    swarmBar.classList.add("visible");
    const swarmTitlePrefix = ss.isSwarm ? "🐝 蜂群合计" : "🤖 子代理";
    let headLabel = `${swarmTitlePrefix} · ${ss.runningCount}/${subs.length} 运行`;
    if (ss.errorCount > 0) headLabel += ` · ⚠️${ss.errorCount} 异常`;
    if (t.tokenUsage.subNetTokens > 0) headLabel += ` · ${fmtTok(t.tokenUsage.subNetTokens)}`;
    setTextIfChanged(swarmLeft, headLabel);
    applySwarmHeaderSpeedBadge(swarmSpeed, ss.liveTokensPerSec, ss.anyWaitingTtft, ss.anyGenerating, ss.runningCount);
    setTextIfChanged(swarmChevron, rec.swarmExpanded ? "▴" : "▾");

    const visibleSubs = rec.swarmExpanded ? subs : subs.filter((s) => s.hasError);
    if (visibleSubs.length === 0) {
      subList.style.display = "none";
      return;
    }
    subList.style.display = "flex";

    let maxBeeRate = 20;
    for (const s of visibleSubs) {
      const r = s.tokenSpeed.active ? s.tokenSpeed.displayTokensPerSec : s.tokenSpeed.avgTokensPerSec;
      if (r > maxBeeRate) maxBeeRate = r;
    }

    const nowPerf = performance.now();
    const activeIds = new Set();

    visibleSubs.forEach((sub, idx) => {
      const scid = sub.conversationId || `idx_${idx}`;
      activeIds.add(scid);
      let sNode = rec.subNodes.get(scid);
      if (!sNode) {
        sNode = createSubRowNode(rec, scid);
        rec.subNodes.set(scid, sNode);
      }
      sNode.sub = sub;

      const ts = sub.tokenSpeed;
      const isStreaming = sub.running && ts.active;

      sNode.rowEl.classList.toggle("has-error", sub.hasError);
      sNode.rowEl.classList.toggle("is-streaming", isStreaming);
      sNode.rowEl.classList.toggle("is-running", sub.running && !isStreaming);

      sNode.dotEl.className = "sub-dot " + (sub.hasError ? "error" : (isStreaming ? "streaming" : (sub.running ? "running" : "waiting")));
      setTextIfChanged(sNode.nameEl, sub.name);
      sNode.nameEl.title = `${sub.name} (${sub.modelLabel})`;

      if (sub.hasError) {
        const reason = sub.errorReason || sub.currentTool || "异常中断";
        sNode.stageLblEl.style.display = "inline";
        setTextIfChanged(sNode.stageLblEl, `· ${reason}`);
        const subWakeLabel = (sub.isStalled && sub.runningStepIndex >= 0)
          ? "⏹ 中断"
          : ((sub.isStalled && sub.runningStepIndex < 0 && sub.bgScript && sub.bgScript.isStalled) ? "终止后台" : "⚡ 唤醒");
        setTextIfChanged(sNode.wakeEl, subWakeLabel);
        if (sub.isStalled && sub.elapsedSec > 0) {
          sNode.timerWrapEl.style.display = "inline";
          setTextIfChanged(sNode.timerEl, fmtDuration(sub.elapsedSec));
          timerRegistry.set(`sub:${rec.taskKey}:${scid}`, {
            el: sNode.timerEl,
            baseSec: sub.elapsedSec,
            syncedAtMs: nowPerf,
          });
        } else {
          sNode.timerWrapEl.style.display = "none";
        }
        sNode.meterWrapEl.style.display = "none";
        sNode.spdEl.style.display = "none";
      } else {
        sNode.meterWrapEl.style.display = "block";
        if (isStreaming) {
          const effRate = ts.displayTokensPerSec;
          const barPct = effRate > 0 ? clamp((effRate / maxBeeRate) * 100, 10, 100) : 16;
          sNode.meterFillEl.style.width = `${barPct.toFixed(0)}%`;
          sNode.meterWrapEl.classList.remove("ctx-warn", "ctx-crit");
          const tip = effRate > 0 ? `实时速率 ${fmtRate(effRate)} tok/s` : (ts.phaseLabel || "等待首字");
          if (sNode.meterWrapEl.title !== tip) sNode.meterWrapEl.title = tip;
        } else {
          const ctxPct = clamp(num(sub.context && sub.context.percent, 0), 0, 100);
          const barPct = ctxPct > 0 ? clamp(ctxPct, 6, 100) : 0;
          sNode.meterFillEl.style.width = `${barPct.toFixed(0)}%`;
          sNode.meterWrapEl.classList.toggle("ctx-crit", ctxPct >= 90);
          sNode.meterWrapEl.classList.toggle("ctx-warn", ctxPct >= 75 && ctxPct < 90);
          const tip = `上下文占用 ${ctxPct.toFixed(1)}% (${fmtK(sub.context.used)}/${fmtK(sub.context.max)})`;
          if (sNode.meterWrapEl.title !== tip) sNode.meterWrapEl.title = tip;
        }

        if (sub.running) {
          const stageWord = isStreaming ? ts.phaseLabel : (sub.currentTool || "执行中");
          sNode.stageLblEl.style.display = "inline";
          setTextIfChanged(sNode.stageLblEl, `· ${stageWord}`);
          sNode.timerWrapEl.style.display = "inline";
          setTextIfChanged(sNode.timerEl, fmtDuration(sub.elapsedSec));
          timerRegistry.set(`sub:${rec.taskKey}:${scid}`, {
            el: sNode.timerEl,
            baseSec: sub.elapsedSec,
            syncedAtMs: nowPerf,
          });
        } else {
          sNode.stageLblEl.style.display = "none";
          setTextIfChanged(sNode.stageLblEl, "");
          sNode.timerWrapEl.style.display = "none";
        }

        applySubBeeSpeedBadge(sNode.spdEl, sub);
        if (sub.running && ts.active && ts.displayTokensPerSec <= 0) {
          const phaseLbl = ts.phase === "waiting_ttft" ? "等待首字" : (ts.phaseLabel || "生成中");
          timerRegistry.set(`sub:${rec.taskKey}:spd:${scid}`, {
            el: sNode.spdEl,
            baseSec: ts.elapsedGenSec,
            syncedAtMs: nowPerf,
            format: (sec) => (sec >= 5 ? `⚡ ${phaseLbl} ${fmtElapsed(sec)}` : `⚡ ${phaseLbl}`),
          });
        }
      }

      if (rec.openSubIds.has(scid)) {
        const detHtml = buildSubDetailHtml(sub);
        if (sNode.detEl.dataset.lastHtml !== detHtml) {
          sNode.detEl.innerHTML = detHtml;
          sNode.detEl.dataset.lastHtml = detHtml;
        }
        sNode.detEl.classList.add("open");
      } else {
        sNode.detEl.classList.remove("open");
      }

      const curChild = subList.children[idx];
      if (curChild !== sNode.wrap) {
        subList.insertBefore(sNode.wrap, curChild || null);
      }
    });

    for (const [scid, sNode] of Array.from(rec.subNodes.entries())) {
      if (!activeIds.has(scid)) {
        if (sNode.wrap.parentNode === subList) subList.removeChild(sNode.wrap);
        if (!subs.some((s) => s.conversationId === scid)) {
          rec.subNodes.delete(scid);
          rec.openSubIds.delete(scid);
        }
      }
    }
  }

  function patchCardRecord(rec, t) {
    rec.task = t;
    const { refs } = rec;

    refs.root.className = `task-card bucket-${t.bucket}` + (!isHudMode && hostConversationId && t.cid === hostConversationId ? " host-focused" : "");

    if (t.workspaceName) {
      refs.wsBadge.style.display = "inline-block";
      setTextIfChanged(refs.wsBadge, t.workspaceName);
    } else {
      refs.wsBadge.style.display = "none";
    }
    setTextIfChanged(refs.title, t.title);
    const fullTitle = `${t.workspaceName ? "[" + t.workspaceName + "] " : ""}${t.title} · ${t.modelLabel}${t.branchName ? " (" + t.branchName + ")" : ""} · ${shortCid(t.cid)}`;
    if (refs.titleWrap.title !== fullTitle) refs.titleWrap.title = fullTitle;

    setTextIfChanged(refs.modelBadge, t.modelLabel);
    const modelTitle = `模型: ${t.modelLabel} · ${shortCid(t.cid)}`;
    if (refs.modelBadge.title !== modelTitle) refs.modelBadge.title = modelTitle;
    if (t.branchName) {
      refs.branchBadge.style.display = "inline-block";
      setTextIfChanged(refs.branchBadge, `⎇ ${t.branchName}`);
    } else {
      refs.branchBadge.style.display = "none";
    }
    const tu = t.tokenUsage;
    const isCacheCliff = Boolean(
      tu.cacheMissStreak >= 2 ||
      (tu.lastTurnCacheHitPct !== null && tu.lastTurnCacheHitPct !== undefined && tu.lastTurnCacheHitPct < 10 && tu.lastTurnInputTokens >= 40000)
    );
    const cacheStr = tu.hasCacheData ? `${Math.round(tu.cacheHitPct)}%` : "--";
    setTextIfChanged(refs.usageChip, `${fmtTok(tu.netTokens)} · 缓存 ${cacheStr}${isCacheCliff ? " ↓" : ""}`);
    refs.usageChip.classList.toggle("is-cache-cliff", isCacheCliff);
    refs.usageChip.classList.toggle("has-cache", Boolean(tu.hasCacheData) && !isCacheCliff);
    const usageTip = isCacheCliff
      ? (tu.cacheMissStreak >= 2 ? `缓存连续未命中 ${tu.cacheMissStreak} 轮，点击查看上下文详情` : "上轮大输入缓存未命中，点击查看上下文详情")
      : "点击查看上下文与缓存详情";
    if (refs.usageChip.title !== usageTip) refs.usageChip.title = usageTip;

    refs.pinBtn.classList.toggle("pinned", t.isPinned);
    setTextIfChanged(refs.pinBtn, t.isPinned ? "★" : "☆");
    refs.hideRecentBtn.style.display = (t.bucket === "RECENT" && !t.isPinned) ? "inline-flex" : "none";

    renderCardRow2Text(rec);

    refs.barTrack.className = "bar-track" + (t.pct >= 90 ? " crit" : t.pct >= 75 ? " warn" : "");
    let { sys, ext, tools, chat } = t.groups;
    if (sys + ext + tools + chat <= 0 && t.used > 0) chat = t.used;
    const denom = Math.max(t.max, sys + ext + tools + chat, 1);
    refs.segSys.style.width = `${Math.min(100, (sys / denom) * 100).toFixed(2)}%`;
    if (ext > 0) {
      refs.segExt.style.display = "";
      refs.segExt.style.width = `${Math.min(100, (ext / denom) * 100).toFixed(2)}%`;
    } else {
      refs.segExt.style.display = "none";
      refs.segExt.style.width = "0%";
    }
    refs.segTools.style.width = `${Math.min(100, (tools / denom) * 100).toFixed(2)}%`;
    refs.segChat.style.width = `${Math.min(100, (chat / denom) * 100).toFixed(2)}%`;

    const hb = t.hb;
    const hbStateLower = String(hb.state || "").toLowerCase();
    const isBgStall = Boolean(!hb.hasAlert && hb.isStalled && hb.runningStepIndex < 0 && hb.bgScript && hb.bgScript.isStalled);
    refs.wakeBtn.style.display = isBgStall ? "inline-flex" : "";
    if (!refs.cancelBtn.disabled) {
      setTextIfChanged(refs.cancelBtn, isBgStall ? "终止后台" : "⏹ 中断步骤");
    }
    const mainTimerKey = `main:${rec.taskKey}`;
    if (hb.hasAlert) {
      refs.stepRow.className = "step-row state-alert";
      refs.stepRow.style.display = "flex";
      refs.stepWarnIcon.style.display = "inline";
      refs.stepDot.style.display = "none";
      const ra = hb.retryAlert;
      if (hbStateLower === "retrying") {
        const attempt = ra ? (ra.attempt > 0 ? ra.attempt : ra.consecutiveErrors) : 0;
        setTextIfChanged(refs.stepLabel, attempt > 0 ? `重试第 ${attempt} 次` : (hb.stateLabel || "连接重试中"));
        if (ra && ra.ageSec !== null && ra.ageSec !== undefined) {
          refs.stepTimerWrap.style.display = "inline";
          setTextIfChanged(refs.stepElapsed, fmtElapsed(ra.ageSec));
          timerRegistry.set(mainTimerKey, {
            el: refs.stepElapsed,
            baseSec: ra.ageSec,
            syncedAtMs: performance.now(),
            format: fmtElapsed,
          });
        } else {
          refs.stepTimerWrap.style.display = "none";
          timerRegistry.delete(mainTimerKey);
        }
      } else if (hbStateLower === "interrupted") {
        const staticLabel = (ra && ra.isTimeout)
          ? "超时中断"
          : ((hb.stateLabel && hb.stateLabel !== "重试告警") ? hb.stateLabel : "断流中断");
        setTextIfChanged(refs.stepLabel, staticLabel);
        refs.stepTimerWrap.style.display = "none";
        timerRegistry.delete(mainTimerKey);
      } else if (hbStateLower === "error") {
        const staticLabel = (hb.stateLabel && hb.stateLabel !== "重试告警") ? hb.stateLabel : "异常中断";
        setTextIfChanged(refs.stepLabel, staticLabel);
        refs.stepTimerWrap.style.display = "none";
        timerRegistry.delete(mainTimerKey);
      } else {
        const fallbackLabel = (hb.stateLabel && hb.stateLabel !== "重试告警") ? hb.stateLabel : (hb.alertMsg || "连接中断");
        setTextIfChanged(refs.stepLabel, fallbackLabel);
        refs.stepTimerWrap.style.display = "none";
        timerRegistry.delete(mainTimerKey);
      }
      if (rec.hintText && Date.now() < rec.hintExpiresAt) {
        setTextIfChanged(refs.stepHint, rec.hintText);
        refs.stepHint.classList.add("visible");
        refs.stepHint.style.display = "block";
      } else if (rec.clearStepHint) {
        rec.clearStepHint();
      }
    } else if (hb.isStalled) {
      refs.stepRow.className = "step-row state-stalled";
      refs.stepRow.style.display = "flex";
      refs.stepWarnIcon.style.display = "none";
      refs.stepDot.style.display = "inline-block";
      setTextIfChanged(refs.stepLabel, hb.toolName ? `${hb.toolName} 超时挂起` : "响应超时挂起");
      if (hb.elapsedSec > 0 || hb.runningStepIndex >= 0 || isBgStall) {
        refs.stepTimerWrap.style.display = "inline";
        setTextIfChanged(refs.stepElapsed, fmtDuration(hb.elapsedSec));
        timerRegistry.set(mainTimerKey, { el: refs.stepElapsed, baseSec: hb.elapsedSec, syncedAtMs: performance.now() });
      } else {
        refs.stepTimerWrap.style.display = "none";
        timerRegistry.delete(mainTimerKey);
      }
      if (rec.hintText && Date.now() < rec.hintExpiresAt) {
        setTextIfChanged(refs.stepHint, rec.hintText);
        refs.stepHint.classList.add("visible");
        refs.stepHint.style.display = "block";
      } else if (rec.clearStepHint) {
        rec.clearStepHint();
      }
    } else {
      refs.stepRow.className = "step-row";
      refs.stepRow.style.display = "none";
      refs.stepWarnIcon.style.display = "none";
      refs.stepTimerWrap.style.display = "none";
      timerRegistry.delete(mainTimerKey);
      if (rec.clearStepHint) rec.clearStepHint();
    }

    renderCardDrawer(rec);
    renderCardSubagents(rec);
  }

  /* ---------- Lazy Idle List Renderer (Deferred in HUD Mode) ---------- */
  function renderIdleListDom(hasActive, showIdleStandalone = false) {
    const idleFooter = el("idleFooter");
    const idleToggleBtn = el("idleToggleBtn");
    const idleList = el("idleList");
    const displayIdleCnt = Math.max(lastTotalIdleCount, lastIdleCandidates.length);
    if ((!hasActive && !showIdleStandalone) || displayIdleCnt === 0) {
      idleFooter.classList.remove("visible", "no-active");
      idleList.classList.remove("open");
      if (idleList.dataset.sig) {
        idleList.dataset.sig = "";
        idleList.innerHTML = "";
      }
      return;
    }

    idleFooter.classList.add("visible");
    const noActive = !hasActive;
    idleFooter.classList.toggle("no-active", noActive);
    idleToggleBtn.style.display = noActive ? "none" : "flex";

    const idleOpen = Boolean(idleDrawerOpen);
    const showList = isHudMode
      ? Boolean(idleOpen || (noActive && showIdleStandalone))
      : Boolean(noActive || idleOpen);
    if (!noActive) {
      setTextIfChanged(el("idleSummaryLabel"), `🕒 历史空闲 ${displayIdleCnt}`);
      setTextIfChanged(el("idleChevron"), idleOpen ? "收起 ▴" : "展开 ▾");
    }
    idleList.classList.toggle("open", showList);

    if (!showList) {
      if (isHudMode && idleList.dataset.sig) {
        idleList.dataset.sig = "";
        idleList.innerHTML = "";
      }
      return;
    }

    const topIdle = lastIdleCandidates.slice(0, 24);
    const sig = topIdle.map((t) => `${t.cid}:${t.title}:${t.workspaceName}:${t.isPinned}:${t.modelLabel}:${t.tokenUsage.netTokens}:${t.tokenUsage.hasCacheData ? Math.round(t.tokenUsage.cacheHitPct) : "x"}:${!isHudMode && hostConversationId === t.cid ? 1 : 0}`).join("|");
    if (idleList.dataset.sig !== sig) {
      idleList.dataset.sig = sig;
      idleList.innerHTML = topIdle.map((t) => {
        const tu = t.tokenUsage;
        const metaStr = `${fmtTok(tu.netTokens)} · 缓存 ${tu.hasCacheData ? Math.round(tu.cacheHitPct) + "%" : "--"}`;
        const isFocused = !isHudMode && hostConversationId && t.cid === hostConversationId;
        return (
          `<div class="idle-item${isFocused ? " host-focused" : ""}" data-cid="${esc(t.cid)}">` +
            `<span class="idle-item-title">${t.workspaceName ? `[${esc(t.workspaceName)}] ` : ""}${esc(t.title)}</span>` +
            `<span class="idle-item-meta mono-num">${metaStr}</span>` +
            `<button class="tiny-icon-btn idle-pin-btn" data-pin-cid="${esc(t.cid)}" type="button" title="固定至主栈">☆</button>` +
          `</div>`
        );
      }).join("");
    }
  }

  /* ---------- Fast I/O Status Renderer (Inside Settings Drawer) ---------- */
  function renderFastIoStatusUI() {
    const mcpOn = Boolean(fastIoConfig.mcpEnabled);
    const batchCalls = Math.round(num(fastIoStats.batchReadCalls, 0));
    const filesCnt = Math.round(num(fastIoStats.batchReadFiles, 0));
    const grepCnt = Math.round(num(fastIoStats.grepCalls, 0));
    const globCnt = Math.round(num(fastIoStats.globCalls, 0));
    const outlineCnt = Math.round(num(fastIoStats.outlineCalls, 0));
    const searchCnt = grepCnt + globCnt + outlineCnt;
    const savedStr = fmtSavedSec(fastIoStats.savedSecEstimate);

    const dot = el("fastIoDot");
    const txt = el("fastIoText");
    const badge = el("fastIoSavedBadge");

    const stateWord = mcpOn ? "Fast I/O 加速在线" : "Fast I/O MCP 已停用";
    dot.className = mcpOn ? "fastio-dot" : "fastio-dot off";

    const html = mcpOn
      ? `${esc(stateWord)} · <span class="fastio-sub">批读 ${filesCnt} 文件 · 检索 ${searchCnt} 次</span>`
      : esc(stateWord);
    if (txt.dataset.lastHtml !== html) {
      txt.innerHTML = html;
      txt.dataset.lastHtml = html;
    }
    setTextIfChanged(badge, `(省 ~${savedStr}s)`);
    badge.classList.toggle("zero", num(fastIoStats.savedSecEstimate, 0) <= 0);

    const tip =
      `${stateWord} | 批读 ${batchCalls}次/${filesCnt}文件 · ` +
      `搜索 ${grepCnt}次 · 目录 ${globCnt}次 · 大纲 ${outlineCnt}次`;
    if (el("fastIoStatusRow").title !== tip) el("fastIoStatusRow").title = tip;
  }

  /* ---------- Global Render Pipeline ---------- */
  function renderMultiTasks(payload, opts = {}) {
    if (!payload || typeof payload !== "object") return;
    const nowSec = opts.localOnlyPrefs ? (Date.now() / 1000) : (num(payload.timestamp, Date.now() / 1000) || (Date.now() / 1000));
    const cfg = payload.config && typeof payload.config === "object" ? payload.config : {};

    if (!opts.localOnlyPrefs && Date.now() > configDirtyUntil) {
      if (typeof cfg.stallThresholdSec === "number") watchdogConfig.stallThresholdSec = cfg.stallThresholdSec;

      const fioCfg = (payload.fastIoConfig && typeof payload.fastIoConfig === "object")
        ? payload.fastIoConfig
        : (cfg.fastIo && typeof cfg.fastIo === "object" ? cfg.fastIo : null);
      if (fioCfg && typeof fioCfg.mcpEnabled === "boolean") {
        fastIoConfig.mcpEnabled = fioCfg.mcpEnabled;
      }
    }

    if (!opts.localOnlyPrefs && payload.fastIoStats && typeof payload.fastIoStats === "object") {
      const st = payload.fastIoStats;
      fastIoStats.batchReadCalls = num(st.batchReadCalls, fastIoStats.batchReadCalls);
      fastIoStats.batchReadFiles = num(st.batchReadFiles, fastIoStats.batchReadFiles);
      fastIoStats.grepCalls = num(st.grepCalls, fastIoStats.grepCalls);
      fastIoStats.globCalls = num(st.globCalls, fastIoStats.globCalls);
      fastIoStats.outlineCalls = num(st.outlineCalls, fastIoStats.outlineCalls);
      fastIoStats.savedSecEstimate = num(st.savedSecEstimate, fastIoStats.savedSecEstimate);
    }

    const hw = (payload.hudWindow && typeof payload.hudWindow === "object")
      ? payload.hudWindow
      : ((payload.hudRuntime && typeof payload.hudRuntime === "object") ? payload.hudRuntime : {});
    const cfgHud = cfg.hud && typeof cfg.hud === "object" ? cfg.hud : {};
    if (!opts.localOnlyPrefs) {
      hudRuntimeRunning = Boolean(hw.running || hw.visible);
    }

    if (!opts.localOnlyPrefs && Date.now() > prefsDirtyUntil && !isUserNativeResizing) {
      const src = { ...cfgHud, ...hw };
      if (typeof src.alwaysOnTop === "boolean") hudPrefs.alwaysOnTop = src.alwaysOnTop;
      if (typeof src.opacity === "number" && src.opacity >= 0.5 && src.opacity <= 1) hudPrefs.opacity = src.opacity;
      if (typeof src.width === "number" && src.width >= HUD_MIN_WIDTH && src.width <= HUD_MAX_WIDTH) hudPrefs.width = Math.round(src.width);
      if (src.customHeight === null || src.customHeight === 0) hudPrefs.customHeight = null;
      else if (typeof src.customHeight === "number" && src.customHeight >= HUD_STACK_MIN_H && src.customHeight <= HUD_CUSTOM_MAX_H) hudPrefs.customHeight = Math.round(src.customHeight);
      if (src.x === null) hudPrefs.x = null;
      else if (isValidHudCoord(src.x)) hudPrefs.x = Math.round(src.x);
      if (src.y === null) hudPrefs.y = null;
      else if (isValidHudCoord(src.y)) hudPrefs.y = Math.round(src.y);
      if (src.physX === null) hudPrefs.physX = null;
      else if (isValidPhysCoord(src.physX)) hudPrefs.physX = Math.round(src.physX);
      if (src.physY === null) hudPrefs.physY = null;
      else if (isValidPhysCoord(src.physY)) hudPrefs.physY = Math.round(src.physY);
      if (typeof src.anchorCorner === "string" && src.anchorCorner) hudPrefs.anchorCorner = src.anchorCorner;
      if (Array.isArray(src.pinnedIds)) hudPrefs.pinnedIds = src.pinnedIds.slice();
    }

    applyAppearance();
    syncSettingControlsUI();

    const rawTasks = Array.isArray(payload.tasks) ? payload.tasks : [];
    const sumRaw = payload.summary && typeof payload.summary === "object" ? payload.summary : null;
    const pinnedSet = new Set(hudPrefs.pinnedIds || []);
    const allTasks = rawTasks.map((r) => normalizeTask(r, nowSec, pinnedSet)).filter((t) => Boolean(t.cid));

    const bucketRank = (t) => (t.bucket === "ALERT" ? 0 : t.isPinned ? 1 : t.bucket === "RUNNING" ? 2 : t.bucket === "RECENT" ? 3 : 4);
    const sorted = allTasks.slice().sort((a, b) => {
      const ra = bucketRank(a), rb = bucketRank(b);
      if (ra !== rb) return ra - rb;
      if (ra <= 2) {
        const ba = a.runBatchStartedAt || 0, bb = b.runBatchStartedAt || 0;
        if (ba !== bb && ba > 0 && bb > 0) return ba - bb;
      }
      if (ra === 3) return (b.justFinishedAt || 0) - (a.justFinishedAt || 0);
      const ma = a.lastModifiedAt || 0, mb = b.lastModifiedAt || 0;
      if (ma !== mb) return mb - ma;
      return a.taskKey.localeCompare(b.taskKey);
    });

    const activeCandidates = [];
    const idleCandidates = [];
    let recentKept = 0;
    let nextRecentExpireMs = 0;

    for (const t of sorted) {
      if (t.bucket === "ALERT" || t.isPinned || t.bucket === "RUNNING") {
        activeCandidates.push(t);
      } else if (t.bucket === "RECENT" && recentKept < 2 && !archivedRecentKeys.has(`${t.taskKey}:${t.justFinishedAt}`)) {
        recentKept++;
        activeCandidates.push(t);
        if (t.justFinishedAt > 0) {
          const exp = Math.round((t.justFinishedAt + 181) * 1000);
          if (nextRecentExpireMs === 0 || exp < nextRecentExpireMs) nextRecentExpireMs = exp;
        }
      } else {
        idleCandidates.push(t);
      }
    }
    earliestRecentExpireAtMs = nextRecentExpireMs;

    let calcAlert = 0, calcRunning = 0, calcRecent = 0, liveSum = 0, calcWaitTtft = false, calcAnyGen = false;
    for (const t of allTasks) {
      if (t.bucket === "ALERT") calcAlert++;
      else if (t.bucket === "RUNNING") calcRunning++;
      else if (t.bucket === "RECENT") calcRecent++;
      const ownLive = t.tokenSpeed.active && t.tokenSpeed.phase !== "waiting_ttft" ? t.tokenSpeed.displayTokensPerSec : 0;
      liveSum += ownLive + t.swarmSummary.liveTokensPerSec;
      if ((t.tokenSpeed.active && t.tokenSpeed.phase === "waiting_ttft") || t.swarmSummary.anyWaitingTtft) calcWaitTtft = true;
      if (t.anyGenerating || (t.tokenSpeed.active && t.tokenSpeed.phase !== "waiting_ttft") || t.swarmSummary.anyGenerating) calcAnyGen = true;
    }
    const calcLiveTps = Math.round(liveSum * 10) / 10;
    const alertCount = sumRaw && sumRaw.alertCount !== undefined ? Math.max(calcAlert, Math.round(num(sumRaw.alertCount, calcAlert))) : calcAlert;
    const runningCount = sumRaw && sumRaw.runningCount !== undefined ? Math.round(num(sumRaw.runningCount, calcRunning)) : calcRunning;
    const recentCount = sumRaw && sumRaw.recentCount !== undefined ? Math.round(num(sumRaw.recentCount, calcRecent)) : calcRecent;
    const totalLiveTps = sumRaw && sumRaw.totalLiveTps !== undefined ? num(sumRaw.totalLiveTps, calcLiveTps) : calcLiveTps;
    const anyGlobalWaitingTtft = sumRaw && sumRaw.anyWaitingTtft !== undefined ? Boolean(sumRaw.anyWaitingTtft) : calcWaitTtft;
    const anyGlobalGenerating = sumRaw && sumRaw.anyGenerating !== undefined ? Boolean(sumRaw.anyGenerating) : calcAnyGen;
    const summaryIdleCount = (sumRaw && sumRaw.idleCount !== undefined)
      ? Math.round(num(sumRaw.idleCount, 0))
      : idleCandidates.length;
    const isCompactPayload = Boolean(payload.compact || lastPayloadCompact);
    const totalTaskCount = (!isCompactPayload && allTasks.length > 0)
      ? allTasks.length
      : Math.max(allTasks.length, alertCount + runningCount + recentCount + summaryIdleCount);

    lastIdleCandidates = idleCandidates;
    lastTotalIdleCount = Math.max(idleCandidates.length, summaryIdleCount);
    const hasActiveCards = activeCandidates.length > 0 || (isCompactPayload && (runningCount > 0 || alertCount > 0));

    if (prevHadActiveCards !== hasActiveCards) {
      manualIdleExpanded = false;
      manualActiveCollapsed = false;
      prevHadActiveCards = hasActiveCards;
    }
    if (lastTotalIdleCount === 0) {
      manualIdleExpanded = false;
    }
    lastHasActiveCards = hasActiveCards;

    const showActiveStack = hasActiveCards && !manualActiveCollapsed;
    const showIdleStandalone = !hasActiveCards && manualIdleExpanded && lastTotalIdleCount > 0;
    const shouldBeExpanded = Boolean(settingsOpen || showActiveStack || showIdleStandalone);
    const isCollapsed = !shouldBeExpanded;

    lastRunningCount = runningCount;
    lastAlertCount = alertCount;

    /* Anti-Flicker Hold */
    const nowWallMs = Date.now();
    let displayLiveTps = totalLiveTps;
    let displayWaitingTtft = anyGlobalWaitingTtft;
    let displayAnyGenerating = anyGlobalGenerating;

    if (totalLiveTps > 0) {
      if (antiFlickerTimerId !== null) {
        clearTimeout(antiFlickerTimerId);
        antiFlickerTimerId = null;
      }
      heldGlobalLiveTps = totalLiveTps;
      heldGlobalLiveAtMs = nowWallMs;
      heldDropPolls = 0;
      displayWaitingTtft = false;
      displayAnyGenerating = false;
    } else if (runningCount <= 0) {
      if (antiFlickerTimerId !== null) {
        clearTimeout(antiFlickerTimerId);
        antiFlickerTimerId = null;
      }
      heldGlobalLiveTps = 0;
      heldGlobalLiveAtMs = 0;
      heldDropPolls = 0;
    } else if (heldGlobalLiveTps > 0) {
      const elapsedSinceLive = nowWallMs - heldGlobalLiveAtMs;
      const canHoldDrop =
        elapsedSinceLive >= 0 &&
        elapsedSinceLive < GLOBAL_TPS_HOLD_MS &&
        heldDropPolls < 2 &&
        (!anyGlobalWaitingTtft || heldDropPolls < 1);
      if (canHoldDrop) {
        if (!opts.localOnlyPrefs) heldDropPolls++;
        displayLiveTps = heldGlobalLiveTps;
        displayWaitingTtft = false;
        displayAnyGenerating = false;
        if (antiFlickerTimerId === null) {
          const remMs = Math.max(30, GLOBAL_TPS_HOLD_MS - elapsedSinceLive + 20);
          antiFlickerTimerId = setTimeout(() => {
            antiFlickerTimerId = null;
            heldGlobalLiveTps = 0;
            heldGlobalLiveAtMs = 0;
            heldDropPolls = 0;
            if (lastFullPayload) {
              renderMultiTasks(lastFullPayload, { localOnlyPrefs: true });
              pollIntervalMs = computeAdaptivePollInterval();
              syncTickTimer();
              syncCalmAnimationFreeze();
            }
          }, remMs);
        }
      } else {
        if (antiFlickerTimerId !== null) {
          clearTimeout(antiFlickerTimerId);
          antiFlickerTimerId = null;
        }
        heldGlobalLiveTps = 0;
        heldGlobalLiveAtMs = 0;
        heldDropPolls = 0;
      }
    }

    lastHasLiveStream = Boolean(displayLiveTps > 0 || displayWaitingTtft || displayAnyGenerating);

    const globalTpsValText = displayLiveTps > 0
      ? `${fmtRate(displayLiveTps)} tok/s`
      : (displayWaitingTtft ? "等待首字" : (displayAnyGenerating ? "生成中" : "0.0 tok/s"));
    const globalTpsStateCls = displayLiveTps > 0 ? "active" : ((displayWaitingTtft || displayAnyGenerating) ? "waiting" : "idle");

    /* Embedded Mode: Low-Power Dock Controller (2500ms) */
    if (!isHudMode && hudRuntimeRunning) {
      el("capsuleUnit").classList.remove("visible", "expanded", "has-global-alert");
      el("dockPanel").classList.add("visible");
      setTextIfChanged(el("dockSummaryText"), `${runningCount} 运行中 · ${alertCount} 待处理`);
      const dockTpsEl = el("dockLiveTps");
      const nextDockCls = "global-tps-badge " + globalTpsStateCls;
      if (dockTpsEl.className !== nextDockCls) dockTpsEl.className = nextDockCls;
      setTextIfChanged(el("dockLiveTpsVal"), globalTpsValText);
      timerRegistry.clear();
      syncTickTimer();
      syncCalmAnimationFreeze();
      pollIntervalMs = computeAdaptivePollInterval();
      return;
    }

    if (isHudMode) {
      const nextVm = shouldBeExpanded ? "stack" : "pill";
      if (hudPrefs.viewMode !== nextVm) {
        hudPrefs.viewMode = nextVm;
        lastSentSize = { w: 0, h: 0, anchor: "", mode: "", idleOpen: false };
        if (nextVm === "stack") stackDomDirty = false;
        saveHudPrefs({ viewMode: nextVm });
      }
    } else {
      embedCollapsed = !shouldBeExpanded;
    }

    el("dockPanel").classList.remove("visible");

    /* Update Unified Capsule Top Bar (#pillShell) */
    const capsuleUnit = el("capsuleUnit");
    capsuleUnit.classList.add("visible");
    capsuleUnit.classList.toggle("expanded", shouldBeExpanded);
    capsuleUnit.classList.toggle("has-global-alert", alertCount > 0);
    if (!shouldBeExpanded && isHudMode && !hasWebViewBridge()) {
      capsuleUnit.style.height = "";
    }

    const pill = el("pillShell");
    pill.classList.toggle("no-expand", !hasActiveCards && lastTotalIdleCount === 0 && !settingsOpen);
    pill.classList.toggle("idle-dim", isCollapsed && alertCount === 0 && runningCount === 0);
    el("pillDot").className = "pill-dot" + (alertCount > 0 ? " alert" : (runningCount > 0 ? " running" : ""));

    const alertTag = el("pillAlertTag");
    let pillStatusStr = "";
    if (alertCount > 0 && runningCount > 0) {
      pillStatusStr = `${runningCount} 运行`;
      setTextIfChanged(alertTag, `⚠️ ${alertCount}`);
      alertTag.classList.add("visible");
    } else if (alertCount > 0) {
      pillStatusStr = `⚠️ ${alertCount} 待处理`;
      alertTag.classList.remove("visible");
    } else if (runningCount > 0) {
      pillStatusStr = `${runningCount} 运行中`;
      alertTag.classList.remove("visible");
    } else {
      pillStatusStr = `全部空闲 (${totalTaskCount})`;
      alertTag.classList.remove("visible");
    }
    setTextIfChanged(el("pillStatusText"), pillStatusStr);
    setTextIfChanged(el("pillTpsVal"), globalTpsValText);
    const tpsGroupEl = el("pillTpsGroup");
    const nextTpsCls = "pill-tps-group" + (globalTpsStateCls === "idle" ? "" : " " + globalTpsStateCls);
    if (tpsGroupEl.className !== nextTpsCls) tpsGroupEl.className = nextTpsCls;

    /* Short-Circuit when Collapsed */
    if (isCollapsed) {
      if (!showActiveStack) {
        el("stackScroll").style.display = "none";
        const collapsedStackList = el("stackList");
        for (const [k, rec] of Array.from(cardRecords.entries())) {
          if (rec.hintTimerId !== null) clearTimeout(rec.hintTimerId);
          for (const sn of rec.subNodes.values()) {
            if (sn && sn.hintTimerId !== null) clearTimeout(sn.hintTimerId);
          }
          if (rec.refs.root.parentNode === collapsedStackList) collapsedStackList.removeChild(rec.refs.root);
          rec.subNodes.clear();
          cardRecords.delete(k);
        }
        renderIdleListDom(false, false);
      }
      stackDomDirty = showActiveStack;
      timerRegistry.clear();
      syncTickTimer();
      syncCalmAnimationFreeze();
      pollIntervalMs = computeAdaptivePollInterval();
      if (isHudMode) scheduleHudResize();
      return;
    }

    /* Expanded Rendering (HUD Stack or Embedded Standalone) */
    stackDomDirty = false;
    renderFastIoStatusUI();

    const stackScroll = el("stackScroll");
    const stackList = el("stackList");
    stackScroll.style.display = showActiveStack ? "block" : "none";

    const activeKeySet = new Set();
    if (showActiveStack) {
      activeCandidates.forEach((t, i) => {
        activeKeySet.add(t.taskKey);
        let rec = cardRecords.get(t.taskKey);
        if (!rec) {
          rec = createCardRecord(t.taskKey);
          cardRecords.set(t.taskKey, rec);
        }
        patchCardRecord(rec, t);
        const curNode = stackList.children[i];
        if (curNode !== rec.refs.root) {
          stackList.insertBefore(rec.refs.root, curNode || null);
        }
      });
    }

    for (const [k, rec] of Array.from(cardRecords.entries())) {
      if (!activeKeySet.has(k)) {
        if (rec.hintTimerId !== null) clearTimeout(rec.hintTimerId);
        for (const sn of rec.subNodes.values()) {
          if (sn && sn.hintTimerId !== null) clearTimeout(sn.hintTimerId);
        }
        if (rec.refs.root.parentNode === stackList) stackList.removeChild(rec.refs.root);
        rec.subNodes.clear();
        cardRecords.delete(k);
        timerRegistry.delete(`main:${k}`);
        timerRegistry.delete(`speed:${k}`);
        clearTimerPrefix(`sub:${k}:`);
      }
    }

    renderIdleListDom(showActiveStack, showIdleStandalone);

    syncTickTimer();
    syncCalmAnimationFreeze();
    pollIntervalMs = computeAdaptivePollInterval();
    scheduleHudResize();

    if (lastPayloadCompact && !shouldRequestCompact()) {
      pollNow(true);
    }
  }

  /* ---------- Real-Time SSE + Adaptive Non-Overlapping Poller ---------- */
  function shouldRequestCompact() {
    if (settingsOpen || idleDrawerOpen || manualIdleExpanded) return false;
    if (!isHudMode) {
      return Boolean(hudRuntimeRunning || embedCollapsed);
    }
    return hudPrefs.viewMode === "pill";
  }

  function buildEventsUrl() {
    const tok = getAuthToken();
    return tok ? `/api/events?token=${encodeURIComponent(tok)}` : "/api/events";
  }

  function closeEventStream() {
    if (sseReconnectTimerId !== null) {
      clearTimeout(sseReconnectTimerId);
      sseReconnectTimerId = null;
    }
    if (sseSource) {
      try { sseSource.close(); } catch (_) {}
      sseSource = null;
    }
    sseConnected = false;
  }

  function scheduleSseReconnect() {
    if (sseReconnectTimerId !== null || typeof EventSource !== "function") return;
    const delay = sseBackoffMs;
    sseBackoffMs = Math.min(SSE_BACKOFF_MAX_MS, Math.round(sseBackoffMs * 1.8));
    sseReconnectTimerId = setTimeout(() => {
      sseReconnectTimerId = null;
      connectEventStream();
    }, delay);
  }

  function connectEventStream() {
    if (typeof EventSource !== "function" || sseSource) return;
    if (sseReconnectTimerId !== null) {
      clearTimeout(sseReconnectTimerId);
      sseReconnectTimerId = null;
    }
    let es;
    try {
      es = new EventSource(buildEventsUrl());
    } catch (_) {
      sseConnected = false;
      scheduleSseReconnect();
      return;
    }
    sseSource = es;
    es.onopen = () => {
      if (sseSource !== es) return;
      sseConnected = true;
      sseBackoffMs = SSE_BACKOFF_MIN_MS;
      pollIntervalMs = computeAdaptivePollInterval();
      if (!pollInFlight) scheduleNextPoll(pollIntervalMs);
    };
    es.addEventListener("rev", (ev) => {
      if (sseSource !== es) return;
      if (!sseConnected) {
        sseConnected = true;
        sseBackoffMs = SSE_BACKOFF_MIN_MS;
        pollIntervalMs = computeAdaptivePollInterval();
      }
      let revVal = null;
      try {
        const parsed = ev && ev.data ? JSON.parse(ev.data) : null;
        if (parsed && parsed.rev !== undefined && parsed.rev !== null) {
          revVal = parsed.rev;
        }
      } catch (_) {}
      if (revVal !== null && revVal !== lastRev) {
        pollNow(true);
      }
    });
    es.onerror = () => {
      if (sseSource !== es) return;
      const wasConnected = sseConnected;
      sseConnected = false;
      try { es.close(); } catch (_) {}
      sseSource = null;
      pollIntervalMs = computeAdaptivePollInterval();
      if (wasConnected && !pollInFlight) {
        scheduleNextPoll(Math.min(pollIntervalMs, 1000));
      }
      scheduleSseReconnect();
    };
  }

  function scheduleNextPoll(delayMs) {
    if (pollTimerId !== null) clearTimeout(pollTimerId);
    const wait = typeof delayMs === "number" ? delayMs : pollIntervalMs;
    pollTimerId = setTimeout(() => {
      pollTimerId = null;
      pollNow(false);
    }, wait);
  }

  async function pollNow(forceFull = false) {
    if (pollTimerId !== null) {
      clearTimeout(pollTimerId);
      pollTimerId = null;
    }
    if (pollInFlight) {
      pollQueuedImmediate = true;
      if (forceFull) pollQueuedForceFull = true;
      return;
    }
    pollInFlight = true;
    pollQueuedImmediate = false;

    if (earliestRecentExpireAtMs > 0 && Date.now() >= earliestRecentExpireAtMs) {
      earliestRecentExpireAtMs = 0;
      forceFull = true;
    }

    const wantCompact = shouldRequestCompact();
    if (lastPayloadCompact && !wantCompact) {
      forceFull = true;
    }

    try {
      let query = "";
      if (!isHudMode && hostConversationId) {
        query = `hintConversationId=${encodeURIComponent(hostConversationId)}`;
      }
      if (wantCompact) {
        query += (query ? "&" : "") + "compact=1";
      }
      if (!forceFull && lastRev !== null && lastFullPayload !== null && !stackDomDirty) {
        query += (query ? "&" : "") + `sinceRev=${encodeURIComponent(String(lastRev))}`;
      }

      const data = await apiFetch(query ? `/api/tasks?${query}` : "/api/tasks");

      lastPollCompletedAt = Date.now();

      if (isConnOffline) {
        isConnOffline = false;
        el("connDot").classList.remove("offline");
        el("dockConnDot").classList.remove("offline");
        el("connDot").title = "实时流运行正常";
        if (!sseSource) {
          sseBackoffMs = SSE_BACKOFF_MIN_MS;
          connectEventStream();
        }
      }

      if (data && data.rev !== undefined && data.rev !== null) {
        lastRev = data.rev;
      }

      if (data && data.unchanged === true && lastFullPayload !== null && !stackDomDirty) {
        if (heldGlobalLiveTps > 0 && (Date.now() - heldGlobalLiveAtMs) >= GLOBAL_TPS_HOLD_MS) {
          if (antiFlickerTimerId !== null) {
            clearTimeout(antiFlickerTimerId);
            antiFlickerTimerId = null;
          }
          heldGlobalLiveTps = 0;
          heldGlobalLiveAtMs = 0;
          heldDropPolls = 0;
          renderMultiTasks(lastFullPayload, { localOnlyPrefs: true });
        }
        pollIntervalMs = computeAdaptivePollInterval();
        syncTickTimer();
        syncCalmAnimationFreeze();
        return;
      }

      lastPayloadCompact = Boolean(wantCompact && data && data.compact !== false);
      lastFullPayload = data;
      renderMultiTasks(data);
    } catch (err) {
      pollIntervalMs = POLL_IDLE_MS;
      if (!isConnOffline) {
        isConnOffline = true;
        el("connDot").classList.add("offline");
        el("dockConnDot").classList.add("offline");
      }
      if (err && err.status === 401) {
        if (tryAuthRecoveryReload()) return;
        el("connDot").title = "认证令牌已过期，请刷新面板";
      } else {
        el("connDot").title = `连接重试中: ${err.message}`;
      }
    } finally {
      pollInFlight = false;
      const nextForce = pollQueuedForceFull;
      const nextImm = pollQueuedImmediate;
      pollQueuedImmediate = false;
      pollQueuedForceFull = false;
      if (nextImm) {
        if (pollTimerId !== null) clearTimeout(pollTimerId);
        pollTimerId = setTimeout(() => { pollTimerId = null; pollNow(nextForce); }, 24);
      } else {
        scheduleNextPoll();
      }
    }
  }

  /* ---------- Settings & HUD Control Actions ---------- */
  function syncSettingControlsUI() {
    el("toggleFastIoMcp").classList.toggle("on", Boolean(fastIoConfig.mcpEnabled));
    el("toggleFastIoMcp").setAttribute("aria-checked", String(Boolean(fastIoConfig.mcpEnabled)));

    el("toggleAlwaysOnTop").classList.toggle("on", Boolean(hudPrefs.alwaysOnTop));
    el("toggleAlwaysOnTop").setAttribute("aria-checked", String(Boolean(hudPrefs.alwaysOnTop)));

    const isManualH = typeof hudPrefs.customHeight === "number" && hudPrefs.customHeight >= HUD_STACK_MIN_H;
    const resetBtn = el("resetHeightBtn");
    resetBtn.classList.toggle("is-manual", isManualH);
    setTextIfChanged(
      resetBtn,
      isManualH ? `↕ 恢复自适应高度 (${Math.round(hudPrefs.customHeight)}px)` : "↕ 自适应伸缩中"
    );

    el("thresholdGroup").querySelectorAll(".seg-btn").forEach((b) => {
      b.classList.toggle("active", Number(b.dataset.sec) === Number(watchdogConfig.stallThresholdSec));
    });
    const pctVal = Math.round((Number(hudPrefs.opacity) || 0.97) * 100);
    if (document.activeElement !== el("opacitySlider")) el("opacitySlider").value = String(pctVal);
    setTextIfChanged(el("opacityVal"), `${pctVal}%`);
  }

  async function saveWatchdogConfig(patch) {
    Object.assign(watchdogConfig, patch);
    configDirtyUntil = Date.now() + 1800;
    syncSettingControlsUI();
    try {
      await apiFetch("/api/config", { method: "POST", body: JSON.stringify(patch) });
    } catch (_) {}
  }

  async function saveFastIoConfig(patch) {
    Object.assign(fastIoConfig, patch);
    configDirtyUntil = Date.now() + 2000;
    syncSettingControlsUI();
    renderFastIoStatusUI();
    const body = {
      fastIo: {
        mcpEnabled: Boolean(fastIoConfig.mcpEnabled),
      },
      fastIoMcpEnabled: Boolean(fastIoConfig.mcpEnabled),
    };
    try {
      await apiFetch("/api/config", { method: "POST", body: JSON.stringify(body) });
    } catch (_) {}
  }

  async function saveHudPrefs(patch, action = "update_prefs") {
    Object.assign(hudPrefs, patch);
    prefsDirtyUntil = Date.now() + 1800;
    applyAppearance();
    syncSettingControlsUI();
    try {
      await apiFetch("/api/hud", {
        method: "POST",
        body: JSON.stringify({ ...patch, prefs: patch, action }),
      });
    } catch (_) {}
  }

  function togglePinConversation(cid) {
    if (!cid) return;
    const list = Array.isArray(hudPrefs.pinnedIds) ? hudPrefs.pinnedIds.slice() : [];
    const idx = list.indexOf(cid);
    if (idx >= 0) list.splice(idx, 1);
    else list.push(cid);
    hudPrefs.pinnedIds = list;
    if (lastFullPayload) renderMultiTasks(lastFullPayload, { localOnlyPrefs: true });
    saveHudPrefs({ pinnedIds: list }).finally(() => pollNow(true));
  }

  async function dockBackToSidebar() {
    prefsDirtyUntil = Date.now() + 2200;
    hudPrefs.enabled = false;
    hudRuntimeRunning = false;
    try {
      await apiFetch("/api/hud", {
        method: "POST",
        body: JSON.stringify({
          action: "close",
          enabled: false,
          source: isHudMode ? "hud_drawer" : "sidebar_dock",
          prefs: { enabled: false },
        }),
      });
    } catch (_) {}
    if (isHudMode) HostWindowBridge.close();
    else pollNow(true);
  }

  /* ---------- Wire UI Controls ---------- */
  el("pillSettingsBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    settingsOpen = !settingsOpen;
    syncExpansionStateAfterUserAction();
  });

  el("resetHeightBtn").addEventListener("click", () => resetCustomHeight());
  el("dockAutoFitBtn").addEventListener("click", () => {
    saveHudPrefs({ customHeight: null }, "reset_auto_height");
  });

  el("dockBackBtn").addEventListener("click", dockBackToSidebar);

  el("popOutHudBtn").addEventListener("click", async () => {
    prefsDirtyUntil = Date.now() + 2000;
    hudPrefs.enabled = true;
    try {
      await apiFetch("/api/hud", {
        method: "POST",
        body: JSON.stringify({
          action: "open",
          enabled: true,
          source: "sidebar_popout",
          prefs: { enabled: true },
        }),
      });
      pollNow(true);
    } catch (_) {}
  });

  el("dockFlashBtn").addEventListener("click", () => {
    apiFetch("/api/hud", { method: "POST", body: JSON.stringify({ action: "flash" }) }).catch(() => {});
  });
  el("dockResetPosBtn").addEventListener("click", () => {
    apiFetch("/api/hud", { method: "POST", body: JSON.stringify({ action: "reset_position" }) }).catch(() => {});
  });
  el("dockRecallBtn").addEventListener("click", dockBackToSidebar);

  const bindSwitchKey = (switchEl, handler) => {
    switchEl.addEventListener("click", handler);
    switchEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handler();
      }
    });
  };

  bindSwitchKey(el("toggleFastIoMcp"), () => {
    saveFastIoConfig({ mcpEnabled: !fastIoConfig.mcpEnabled });
  });
  bindSwitchKey(el("toggleAlwaysOnTop"), () => {
    const next = !hudPrefs.alwaysOnTop;
    HostWindowBridge.setTopMost(next);
    saveHudPrefs({ alwaysOnTop: next });
  });

  el("thresholdGroup").querySelectorAll(".seg-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      saveWatchdogConfig({ stallThresholdSec: Number(btn.dataset.sec) || 0 });
    });
  });

  let opacityDebounce = null;
  el("opacitySlider").addEventListener("input", (ev) => {
    const val = clamp(Number(ev.target.value) || 97, 72, 100) / 100;
    hudPrefs.opacity = val;
    prefsDirtyUntil = Date.now() + 1800;
    setTextIfChanged(el("opacityVal"), `${Math.round(val * 100)}%`);
    applyAppearance();
    if (opacityDebounce) clearTimeout(opacityDebounce);
    opacityDebounce = setTimeout(() => {
      opacityDebounce = null;
      saveHudPrefs({ opacity: val });
    }, 280);
  });

  el("idleToggleBtn").addEventListener("click", () => {
    idleDrawerOpen = !idleDrawerOpen;
    renderIdleListDom(
      Boolean(lastHasActiveCards && !manualActiveCollapsed),
      Boolean(!lastHasActiveCards && manualIdleExpanded && lastTotalIdleCount > 0)
    );
    scheduleHudResize();
    if (idleDrawerOpen && lastPayloadCompact) {
      pollNow(true);
    }
  });

  el("idleList").addEventListener("click", (e) => {
    if (!(e.target instanceof Element)) return;
    const btn = e.target.closest("[data-pin-cid]");
    if (btn) {
      e.stopPropagation();
      togglePinConversation(btn.getAttribute("data-pin-cid") || "");
      return;
    }
    const row = e.target.closest(".idle-item");
    if (!isHudMode && row && row.dataset.cid && window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "toggle-conversation", payload: { conversationId: row.dataset.cid } }, "*");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && settingsOpen) {
      settingsOpen = false;
      syncExpansionStateAfterUserAction();
    }
  });

  document.addEventListener("visibilitychange", () => {
    syncTickTimer();
    syncCalmAnimationFreeze();
    pollIntervalMs = computeAdaptivePollInterval();
    if (!document.hidden) {
      if (!sseSource && !sseConnected) {
        sseBackoffMs = SSE_BACKOFF_MIN_MS;
        connectEventStream();
      }
      if (isHudMode) scheduleHudResize();
      pollNow(false);
    }
  });
  window.addEventListener("focus", () => {
    if (Date.now() - lastPollCompletedAt > 450) pollNow(false);
  });
  window.addEventListener("beforeunload", closeEventStream);

  el("capsuleUnit").classList.add("visible");
  el("capsuleUnit").classList.remove("expanded");
  applyAppearance();
  syncSettingControlsUI();
  renderFastIoStatusUI();
  syncCalmAnimationFreeze();
  pollNow(true);
  connectEventStream();
})();
  </script>
</body>
</html>
