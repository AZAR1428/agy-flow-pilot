<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Flow Pilot · 实时监控</title>
  <style>
  /* Flow Pilot v3.9.0 — Light-Only Unified Capsule + Real-Time SSE & Anti-Jitter Telemetry Design Tokens */
  :root,
  html[data-theme="light"] {
    color-scheme: light;
    --fp-sans: "Inter", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    --fp-mono: "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", monospace;
    --fp-win-alpha: 0.97;
    --fp-canvas: #ECEBE6;
    --fp-canvas-rgb: 236, 235, 230;
    --fp-card-rgb: 255, 255, 255;
    --fp-card-hover-rgb: 252, 251, 249;
    --fp-sub-rgb: 243, 242, 238;
    --fp-recessed: #E2E0D9;
    --fp-track: rgba(20, 20, 22, 0.075);

    --fp-border: rgba(24, 24, 27, 0.07);
    --fp-border-subtle: rgba(24, 24, 27, 0.05);
    --fp-border-strong: rgba(24, 24, 27, 0.16);
    --fp-shell-border: rgba(24, 24, 27, 0.15);
    --fp-shell-bevel:
      inset 0 1px 0 rgba(255, 255, 255, 0.92),
      inset 0 0 0 0.5px rgba(24, 24, 27, 0.08);
    --fp-card-shadow:
      0 1px 2px rgba(20, 20, 22, 0.05),
      0 10px 22px -8px rgba(20, 20, 22, 0.048),
      inset 0 1px 0 #FFFFFF;
    --fp-pill-shadow:
      0 1px 2px rgba(20, 20, 22, 0.06),
      inset 0 1px 0 #FFFFFF;

    --fp-text: #141416;
    --fp-text-sec: #4E4C46;
    --fp-text-muted: #858279;
    --fp-text-faint: #A5A198;

    --fp-accent: #2B44FF;
    --fp-accent-hover: #2541F0;
    --fp-accent-soft: rgba(43, 68, 255, 0.095);
    --fp-accent-med: rgba(43, 68, 255, 0.19);
    --fp-accent-ring: rgba(43, 68, 255, 0.24);

    --fp-sys: #2B44FF;
    --fp-ext: #7C3AED;
    --fp-tool: #0D9488;
    --fp-chat: #D97706;

    --fp-ok: #15803D;
    --fp-ok-soft: rgba(21, 128, 61, 0.11);
    --fp-wait: #2B44FF;
    --fp-wait-soft: rgba(43, 68, 255, 0.095);
    --fp-warn: #B45309;
    --fp-warn-bg: rgba(217, 119, 6, 0.10);
    --fp-warn-border: rgba(180, 83, 9, 0.30);
    --fp-danger: #E11D48;
    --fp-danger-bg: rgba(225, 29, 72, 0.09);
    --fp-danger-border: rgba(225, 29, 72, 0.32);

    --fp-scroll-thumb: #C5C2B9;
    --fp-grip-stroke: rgba(20, 20, 22, 0.26);
  }

  *, *::before, *::after { box-sizing: border-box; min-width: 0; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    color: var(--fp-text);
    font-family: var(--fp-sans);
    font-size: 12px;
    line-height: 1.42;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  /* 4px arrowless rounded scrollbars */
  *::-webkit-scrollbar { width: 4px; height: 4px; }
  *::-webkit-scrollbar-button,
  *::-webkit-scrollbar-button:single-button,
  *::-webkit-scrollbar-button:vertical:decrement,
  *::-webkit-scrollbar-button:vertical:increment,
  *::-webkit-scrollbar-button:horizontal:decrement,
  *::-webkit-scrollbar-button:horizontal:increment,
  *::-webkit-scrollbar-corner { display: none !important; width: 0 !important; height: 0 !important; background: transparent !important; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--fp-scroll-thumb); border-radius: 999px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--fp-text-muted); }

  html.mode-hud, body.mode-hud { height: 100%; overflow: hidden; background: transparent; user-select: none; }
  body.mode-embed { min-height: 100vh; overflow-x: hidden; overflow-y: auto; background: var(--fp-canvas); }

  /* Calm-mode zero-FPS compositor hibernation */
  body.is-calm *:not(.flash-highlight) { animation-name: none !important; animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .pill-dot.running,
    .pill-dot.alert,
    .sub-dot.running,
    .sub-dot.streaming,
    .step-row.state-stalled .status-dot,
    .global-tps-badge.waiting,
    .speed-badge.waiting,
    .capsule-unit:not(.expanded).has-global-alert {
      animation: none !important;
    }
  }

  .selectable { user-select: text; cursor: text; }
  .mono-num { font-family: var(--fp-mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; letter-spacing: 0; }

  .app-root { width: 100%; height: 100%; }
  body.mode-embed .app-root { max-width: 560px; margin: 0 auto; padding: 8px; height: auto; }

  /* ---------- Unified Equal-Width Capsule Unit (Single Outer Shell) ---------- */
  .capsule-unit {
    position: relative;
    display: none;
    flex-direction: column;
    gap: 0;
    width: 100%;
    background: rgba(var(--fp-canvas-rgb), var(--fp-win-alpha));
    background-clip: padding-box;
    border: 1px solid var(--fp-shell-border);
    box-shadow: var(--fp-shell-bevel);
    overflow: hidden;
    transition: border-color 0.18s ease, border-radius 0.14s ease;
  }
  .capsule-unit.visible { display: flex; }
  .capsule-unit:not(.expanded) { border-radius: 18px; }
  .capsule-unit.expanded { border-radius: 14px; }
  .capsule-unit.has-global-alert { border-color: var(--fp-danger-border); }
  .capsule-unit:not(.expanded).has-global-alert { animation: fpAlertInset 1.5s infinite ease-in-out; }
  body.mode-hud .capsule-unit.expanded { height: 100%; }
  body.mode-embed .capsule-unit { background: var(--fp-canvas); box-shadow: var(--fp-card-shadow); }

  .pill-shell {
    position: relative;
    z-index: 2;
    display: flex;
    width: 100%;
    height: 34px;
    min-height: 34px;
    flex-shrink: 0;
    padding: 0 10px;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    transition: opacity 0.18s ease;
  }
  body.mode-hud .pill-shell { cursor: grab; }
  body.mode-hud .pill-shell:active { cursor: grabbing; }
  body.mode-embed .pill-shell { cursor: pointer; }
  body.mode-embed .pill-shell.no-expand { cursor: default; }

  .capsule-unit.expanded .pill-shell {
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  .pill-shell.idle-dim { opacity: 0.90; }
  .pill-shell.idle-dim:hover { opacity: 1; }

  .pill-left {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 20px;
    white-space: nowrap;
    flex: 0 1 auto;
    min-width: 0;
  }
  .pill-brand-mini {
    position: relative;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: var(--fp-accent);
    color: #FFFFFF;
    display: inline-grid;
    place-items: center;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  .conn-dot {
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: var(--fp-ok);
    border: 1.5px solid var(--fp-canvas);
  }
  .conn-dot.offline { background: var(--fp-warn); }

  .pill-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--fp-text-muted); }
  .pill-dot.running { background: var(--fp-accent); box-shadow: 0 0 0 2.5px var(--fp-accent-soft); animation: fpPulse 1.2s infinite ease-in-out; }
  .pill-dot.alert { background: var(--fp-danger); box-shadow: 0 0 0 2.5px var(--fp-danger-bg); animation: fpPulse 0.95s infinite ease-in-out; }

  .pill-status-text {
    white-space: nowrap;
    height: 20px;
    line-height: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--fp-text);
    font-variant-numeric: tabular-nums;
  }
  .pill-tps-group {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    height: 20px;
    line-height: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--fp-text-sec);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .pill-tps-group.active { color: var(--fp-accent); }
  .pill-tps-group.waiting { color: var(--fp-wait); }
  .pill-tps-val {
    display: inline-block;
    width: 80px;
    min-width: 80px;
    height: 20px;
    line-height: 20px;
    text-align: right;
    font-family: var(--fp-mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  .pill-tps-val::after { content: "\200B"; font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }

  .pill-alert-tag {
    display: none;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--fp-danger-bg);
    border: 1px solid var(--fp-danger-border);
    color: var(--fp-danger);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    flex-shrink: 0;
    font-family: var(--fp-mono);
  }
  .pill-alert-tag.visible { display: inline-flex; align-items: center; gap: 2px; }

  .pill-settings-btn {
    flex-shrink: 0;
    appearance: none;
    border: 1px solid var(--fp-border);
    background: rgb(var(--fp-card-rgb));
    box-shadow: var(--fp-pill-shadow);
    color: var(--fp-text-sec);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    padding: 0;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.14s ease, color 0.14s ease, background-color 0.14s ease, transform 0.1s ease;
  }
  .pill-settings-btn:hover { border-color: var(--fp-border-strong); color: var(--fp-text); background: rgb(var(--fp-card-hover-rgb)); }
  .pill-settings-btn:active { transform: scale(0.95); }
  .pill-settings-btn.active { border-color: var(--fp-accent-med); background: var(--fp-accent-soft); color: var(--fp-accent); }

  /* ---------- Seamless Unified Dropdown Shell ---------- */
  .dropdown-shell {
    position: relative;
    z-index: 1;
    display: none;
    flex-direction: column;
    gap: 0;
    width: 100%;
    margin-top: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    overflow: hidden;
  }
  .capsule-unit.expanded .dropdown-shell {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
  }
  body.mode-embed .dropdown-shell {
    background: transparent;
    box-shadow: none;
  }

  .flash-highlight { animation: fpFlashLocate 0.52s ease-in-out 3 !important; }

  /* ---------- 8-Direction Resize Hit-Test Layer (Edge W/E in Pill, All 8 When Expanded) ---------- */
  .resize-layer { display: none; pointer-events: none; position: absolute; inset: 0; z-index: 60; }
  body.mode-hud .capsule-unit.visible .resize-layer { display: block; }
  .capsule-unit:not(.expanded) .resize-edge.edge-n,
  .capsule-unit:not(.expanded) .resize-edge.edge-s,
  .capsule-unit:not(.expanded) .resize-corner { display: none; }
  .capsule-unit:not(.expanded) .resize-edge.edge-w,
  .capsule-unit:not(.expanded) .resize-edge.edge-e { top: 6px; bottom: 6px; width: 6px; }

  .resize-edge, .resize-corner { position: absolute; pointer-events: auto; background: transparent; transition: background-color 0.14s ease; }
  .resize-edge.edge-n { top: 0; left: 10px; right: 10px; height: 5px; cursor: ns-resize; }
  .resize-edge.edge-s { bottom: 0; left: 10px; right: 10px; height: 5px; cursor: ns-resize; }
  .resize-edge.edge-w { left: 0; top: 10px; bottom: 10px; width: 5px; cursor: ew-resize; }
  .resize-edge.edge-e { right: 0; top: 10px; bottom: 10px; width: 5px; cursor: ew-resize; }
  .resize-edge:hover { background: var(--fp-accent-soft); }
  .resize-corner { width: 10px; height: 10px; z-index: 62; }
  .resize-corner.corner-nw { top: 0; left: 0; cursor: nwse-resize; }
  .resize-corner.corner-ne { top: 0; right: 0; cursor: nesw-resize; }
  .resize-corner.corner-sw { bottom: 0; left: 0; cursor: nesw-resize; }
  .resize-corner.corner-se { bottom: 0; right: 0; cursor: nwse-resize; }
  .resize-corner.corner-se::after {
    content: "";
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 7px;
    height: 7px;
    background: linear-gradient(
      135deg,
      transparent 0%,
      transparent 42%,
      var(--fp-grip-stroke) 42%,
      var(--fp-grip-stroke) 55%,
      transparent 55%,
      transparent 74%,
      var(--fp-grip-stroke) 74%,
      var(--fp-grip-stroke) 88%,
      transparent 88%
    );
    opacity: 0.85;
    pointer-events: none;
  }
  .resize-corner.corner-se:hover::after { opacity: 1; filter: brightness(0.85); }

  /* ---------- Global TPS Badge (Used in Dock Panel) ---------- */
  .global-tps-badge {
    flex: 0 0 auto;
    min-width: 112px;
    height: 22px;
    padding: 0 7px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 3px;
    font-family: var(--fp-sans);
    font-size: 11px;
    font-weight: 600;
    line-height: 18px;
    letter-spacing: 0;
    white-space: nowrap;
    border: 1px solid var(--fp-border);
    background: rgb(var(--fp-card-rgb));
    color: var(--fp-text-sec);
    box-shadow: var(--fp-pill-shadow);
    transition: background-color 0.16s ease, color 0.16s ease, border-color 0.16s ease;
  }
  .global-tps-badge .gtps-bolt { flex: 0 0 auto; font-size: 11px; line-height: 1; display: inline-flex; align-items: center; }
  .global-tps-badge .gtps-lbl { flex: 0 0 auto; height: 18px; line-height: 18px; font-weight: 600; }
  .global-tps-badge .gtps-val { flex: 1 1 auto; height: 18px; line-height: 18px; text-align: right; font-family: var(--fp-mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .global-tps-badge.active { background: var(--fp-accent-soft); border-color: var(--fp-accent-med); color: var(--fp-accent); }
  .global-tps-badge.waiting { background: var(--fp-wait-soft); border-color: var(--fp-accent-med); color: var(--fp-wait); animation: fpBorderBreath 1.4s infinite ease-in-out; }
  .global-tps-badge.idle { color: var(--fp-text-muted); }

  /* ---------- Inline Settings Drawer (In-Place Above Session Stream) ---------- */
  .settings-drawer {
    display: none;
    flex-direction: column;
    gap: 7px;
    padding: 4px 10px 8px;
    border-bottom: none;
    background: transparent;
    font-size: 11px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .settings-drawer.open { display: flex; }
  .settings-drawer > .set-row,
  .settings-drawer > .switch-btn { padding: 0 10px; }

  .settings-group-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 7px 9px;
    border-radius: 9px;
    background: rgb(var(--fp-card-rgb));
    border: 1px solid var(--fp-border);
    box-shadow: var(--fp-pill-shadow);
  }
  .fastio-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--fp-border-subtle);
  }
  .fastio-main { display: flex; align-items: center; gap: 6px; flex: 1 1 0; min-width: 0; }
  .fastio-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fp-ok); box-shadow: 0 0 0 3px var(--fp-ok-soft); flex-shrink: 0; }
  .fastio-dot.off { background: var(--fp-text-muted); box-shadow: none; }
  .fastio-text { font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--fp-text); white-space: normal; line-height: 1.38; font-variant-numeric: tabular-nums; }
  .fastio-text .fastio-sub { font-weight: 500; color: var(--fp-text-muted); }
  .fastio-saved-pill {
    flex-shrink: 0;
    min-width: 64px;
    height: 20px;
    line-height: 20px;
    padding: 0 7px;
    border-radius: 999px;
    background: var(--fp-accent-soft);
    color: var(--fp-accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    text-align: center;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .fastio-saved-pill.zero { background: rgb(var(--fp-sub-rgb)); color: var(--fp-text-muted); }

  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: 0; color: var(--fp-text-sec); }

  .switch-btn { display: inline-flex; align-items: center; justify-content: space-between; width: 100%; cursor: pointer; user-select: none; font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--fp-text); }
  .switch-track { width: 30px; height: 17px; border-radius: 999px; background: var(--fp-recessed); border: 1px solid var(--fp-border-strong); position: relative; transition: background-color 0.16s ease, border-color 0.16s ease; flex-shrink: 0; }
  .switch-track::after { content: ""; position: absolute; top: 1.5px; left: 1.5px; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22); transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1); }
  .switch-btn.on .switch-track { background: var(--fp-accent); border-color: var(--fp-accent); }
  .switch-btn.on .switch-track::after { transform: translateX(13px); }

  .seg-group { display: inline-flex; background: var(--fp-recessed); border: 1px solid var(--fp-border); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg-btn { appearance: none; border: none; background: transparent; color: var(--fp-text-sec); font-size: 11px; font-weight: 500; letter-spacing: 0; padding: 2.5px 7px; border-radius: 5px; cursor: pointer; font-family: inherit; transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease; }
  .seg-btn:hover { color: var(--fp-text); }
  .seg-btn.active { background: rgb(var(--fp-card-rgb)); color: var(--fp-accent); font-weight: 600; box-shadow: var(--fp-pill-shadow); }

  .fit-reset-btn { appearance: none; border: 1px solid var(--fp-border-strong); background: rgb(var(--fp-card-rgb)); box-shadow: var(--fp-pill-shadow); color: var(--fp-text); font-size: 11px; font-weight: 600; letter-spacing: 0; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; transition: border-color 0.14s ease, color 0.14s ease, background-color 0.14s ease; }
  .fit-reset-btn:hover, .fit-reset-btn.is-manual { border-color: var(--fp-accent-med); background: var(--fp-accent-soft); color: var(--fp-accent); }

  .alpha-wrap { display: inline-flex; align-items: center; gap: 6px; width: 136px; }
  .alpha-slider { flex: 1 1 auto; height: 4px; accent-color: var(--fp-accent); cursor: pointer; }
  .alpha-val { width: 34px; text-align: right; font-size: 11px; color: var(--fp-text); }

  .drawer-bottom-actions { display: flex; align-items: center; gap: 6px; padding-top: 2px; border-top: none; }
  .drawer-action-btn {
    width: 100%;
    appearance: none;
    border: 1px solid var(--fp-border-strong);
    background: rgb(var(--fp-card-rgb));
    box-shadow: var(--fp-pill-shadow);
    color: var(--fp-text);
    border-radius: 7px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: border-color 0.14s ease, color 0.14s ease, background-color 0.14s ease;
  }
  .drawer-action-btn:hover { border-color: var(--fp-accent-med); color: var(--fp-accent); background: var(--fp-accent-soft); }
  .drawer-action-btn.primary { border-color: var(--fp-accent-med); background: var(--fp-accent-soft); color: var(--fp-accent); }
  .drawer-action-btn.primary:hover { background: var(--fp-accent); border-color: var(--fp-accent); color: #FFFFFF; }

  /* ---------- Pure Session Stream ---------- */
  .stack-scroll { flex: 1 1 auto; min-height: 48px; max-height: none; overflow: hidden; }
  .capsule-unit.scroll-capped .stack-scroll { flex: 1 1 0; min-height: 48px; max-height: none; overflow-y: auto; }
  .capsule-unit.manual-height:not(.scroll-capped) .stack-scroll { flex: 1 1 auto; max-height: none; overflow-y: hidden; }
  body.mode-embed .stack-scroll { max-height: none; min-height: 0; overflow: visible; }

  .stack-list { display: flex; flex-direction: column; gap: 8px; padding: 8px; }

  /* ---------- Master Task Card ---------- */
  .task-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 11px;
    border-radius: 12px;
    background: rgb(var(--fp-card-rgb));
    border: 1px solid var(--fp-border);
    box-shadow: var(--fp-card-shadow);
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }
  .task-card:hover { border-color: var(--fp-border-strong); }

  <script>
(function () {
  "use strict";

  const urlParams = new URLSearchParams(window.location.search);
  const isHudMode = (urlParams.get("mode") || "").toLowerCase() === "hud";
  let hostConversationId = urlParams.get("conversationId") || "";

  const modeCls = isHudMode ? "mode-hud" : "mode-embed";
  document.documentElement.classList.add(modeCls);
  document.body.classList.add(modeCls);

  const el = (id) => document.getElementById(id);

  /* ---------- Geometry & Adaptive Polling Constants ---------- */
  const HUD_DEFAULT_WIDTH = 388;
  const HUD_MIN_WIDTH = 320;
  const HUD_MAX_WIDTH = 960;
  const HUD_PILL_HEIGHT = 36;
  const HUD_STACK_MIN_H = 68;
  const HUD_CUSTOM_MAX_H = 4096;
  const HUD_DPI_SUBPIXEL_PAD = 2;
  const GLOBAL_TPS_HOLD_MS = 650;

  const POLL_STREAM_MS = 250;
  const POLL_RUNNING_MS = 500;
  const POLL_IDLE_MS = 2500;
  const POLL_DOCK_MS = 2500;
  const POLL_SSE_ACTIVE_MS = 5000;
  const POLL_SSE_IDLE_MS = 10000;
  const TICK_INTERVAL_MS = 1000;
  const SSE_BACKOFF_MIN_MS = 1500;
  const SSE_BACKOFF_MAX_MS = 30000;

  /* ---------- Static Mode Visibility ---------- */
  el("popOutHudBtn").style.display = !isHudMode ? "inline-flex" : "none";
  el("alwaysOnTopRow").style.display = isHudMode ? "flex" : "none";
  el("opacityRow").style.display = isHudMode ? "flex" : "none";
  el("heightModeRow").style.display = isHudMode ? "flex" : "none";
  el("dockBackBtn").style.display = isHudMode ? "inline-flex" : "none";

  /* ---------- State Store ---------- */
  let watchdogConfig = { stallThresholdSec: 90 };
  let fastIoConfig = { mcpEnabled: true };
  let fastIoStats = {
    batchReadCalls: 0, batchReadFiles: 0, grepCalls: 0, globCalls: 0,
    outlineCalls: 0, savedSecEstimate: 0.0,
  };

  const initVmParam = (urlParams.get("viewMode") || "").toLowerCase();
  let hudPrefs = {
    enabled: true,
    viewMode: (initVmParam === "pill" || initVmParam === "stack") ? initVmParam : "pill",
    alwaysOnTop: true,
    opacity: 0.97,
    width: HUD_DEFAULT_WIDTH,
    customHeight: null,
    x: null,
    y: null,
    physX: null,
    physY: null,
    anchorCorner: "top-right",
    pinnedIds: [],
  };

  let hudRuntimeRunning = false;
  let embedCollapsed = true;
  let settingsOpen = false;
  let idleDrawerOpen = false;
  let manualIdleExpanded = false;
  let manualActiveCollapsed = false;
  let prevHadActiveCards = null;
  let lastHasActiveCards = false;
  let configDirtyUntil = 0;
  let prefsDirtyUntil = 0;

  let pollInFlight = false;
  let pollTimerId = null;
  let pollIntervalMs = POLL_IDLE_MS;
  let pollQueuedImmediate = false;
  let pollQueuedForceFull = false;
  let fastPollBoostUntil = 0;
  let lastPollCompletedAt = 0;

  let sseSource = null;
  let sseConnected = false;
  let sseReconnectTimerId = null;
  let sseBackoffMs = SSE_BACKOFF_MIN_MS;

  let lastRev = null;
  let lastFullPayload = null;
  let lastPayloadCompact = false;
  let stackDomDirty = false;
  let isConnOffline = false;
  let earliestRecentExpireAtMs = 0;

  let lastRunningCount = 0;
  let lastAlertCount = 0;
  let lastHasLiveStream = false;
  let lastCalmClassState = true;

  let heldGlobalLiveTps = 0;
  let heldGlobalLiveAtMs = 0;
  let heldDropPolls = 0;
  let antiFlickerTimerId = null;

  let lastIdleCandidates = [];
  let lastTotalIdleCount = 0;
  let lastAutoComputedHeight = 260;

  let isUserNativeResizing = false;
  let activeResizeEdge = "";
  let nativeResizeGuardTimer = null;
  let tickTimerId = null;

  const cardRecords = new Map();
  const timerRegistry = new Map();
  const archivedRecentKeys = new Set();

  /* ---------- Formatting Helpers ---------- */
  const num = (v, fb = 0) => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : fb; };
  const optNum = (v) => {
    if (v === null || v === undefined || v === "") return null;
    const n = Number(v);
    return Number.isFinite(n) && n >= 0 ? n : null;
  };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const fmtK = (t) => {
    const n = num(t, 0);
    if (n <= 0) return "0k";
    const k = n / 1000;
    return k >= 100 || Math.abs(k - Math.round(k)) < 0.05 ? `${Math.round(k)}k` : `${k.toFixed(1)}k`;
  };
  const fmtTok = (t) => {
    const v = num(t, 0);
    if (v < 1000) return `${Math.round(v)}`;
    if (v < 1000000) return `${(v / 1000).toFixed(v >= 100000 ? 0 : 1).replace(/\.0$/, "")}k`;
    return `${(v / 1000000).toFixed(2).replace(/\.?0+$/, "")}M`;
  };
  const fmtDuration = (sec) => {
    const s = num(sec, 0);
    if (s < 60) return `${s.toFixed(1)}s`;
    const m = Math.floor(s / 60), rem = Math.floor(s % 60);
    return m < 60 ? `${m}m ${rem}s` : `${Math.floor(m / 60)}h ${m % 60}m`;
  };
  const fmtElapsed = (sec) => {
    const s = Math.max(0, Math.floor(num(sec, 0)));
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60), rem = s % 60;
    return m < 60 ? `${m}m ${rem}s` : `${Math.floor(m / 60)}h ${m % 60}m`;
  };
  const fmtPctCompact = (p) => {
    const v = num(p, 0);
    return Math.abs(v - Math.round(v)) < 0.05 ? `${Math.round(v)}%` : `${v.toFixed(1)}%`;
  };
  const fmtRate = (r) => { const v = num(r, 0); return v >= 1000 ? `${Math.round(v)}` : v.toFixed(1); };
  const fmtSavedSec = (sec) => {
    const v = num(sec, 0);
    if (v <= 0) return "0";
    return v >= 10 || Math.abs(v - Math.round(v)) < 0.08 ? `${Math.round(v)}` : v.toFixed(1);
  };
  const fmtTtft = (ms) => {
    const v = num(ms, 0);
    return v <= 0 ? "--" : (v >= 1000 ? `${(v / 1000).toFixed(1)}s` : `${Math.round(v)}ms`);
  };
  const shortCid = (cid) => (cid && cid.length > 8 ? cid.slice(0, 8) : cid || "");
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function setTextIfChanged(node, text) {
    if (node && node.textContent !== text) node.textContent = text;
  }

  /* ---------- Dynamic Stopwatch & Calm Animation Hibernation ---------- */
  function stopTickTimer() {
    if (tickTimerId !== null) {
      clearInterval(tickTimerId);
      tickTimerId = null;
    }
  }

  function tickElapsedTimers() {
    if (
      timerRegistry.size === 0 ||
      document.hidden ||
      (isHudMode && hudPrefs.viewMode === "pill") ||
      (!isHudMode && (hudRuntimeRunning || embedCollapsed))
    ) {
      stopTickTimer();
      return;
    }
    const now = performance.now();
    let liveCnt = 0;
    for (const [k, item] of timerRegistry.entries()) {
      if (item.el && item.el.isConnected) {
        liveCnt++;
        const secNow = item.baseSec + (now - item.syncedAtMs) / 1000;
        const text = typeof item.format === "function" ? item.format(secNow) : fmtDuration(secNow);
        setTextIfChanged(item.el, text);
      } else {
        timerRegistry.delete(k);
      }
    }
    if (liveCnt === 0) stopTickTimer();
  }

  function syncTickTimer() {
    const shouldRun =
      timerRegistry.size > 0 &&
      !document.hidden &&
      !(isHudMode && hudPrefs.viewMode === "pill") &&
      !(!isHudMode && (hudRuntimeRunning || embedCollapsed));
    if (shouldRun) {
      if (tickTimerId === null) {
        tickTimerId = setInterval(tickElapsedTimers, TICK_INTERVAL_MS);
      }
    } else {
      stopTickTimer();
    }
  }

  function syncCalmAnimationFreeze() {
    const shouldBeCalm = Boolean(document.hidden || (!lastHasLiveStream && lastAlertCount === 0));
    if (shouldBeCalm !== lastCalmClassState) {
      lastCalmClassState = shouldBeCalm;
      document.body.classList.toggle("is-calm", shouldBeCalm);
    }
  }

  function computeAdaptivePollInterval() {
    if (sseConnected) {
      if (
        document.hidden ||
        (!isHudMode && hudRuntimeRunning) ||
        (!lastHasLiveStream && lastRunningCount === 0 && lastAlertCount === 0)
      ) {
        return POLL_SSE_IDLE_MS;
      }
      return POLL_SSE_ACTIVE_MS;
    }
    if (document.hidden || (!isHudMode && hudRuntimeRunning)) {
      return POLL_DOCK_MS;
    }
    if (lastHasLiveStream || Date.now() < fastPollBoostUntil) {
      return POLL_STREAM_MS;
    }
    if (lastRunningCount > 0 || lastAlertCount > 0) {
      return POLL_RUNNING_MS;
    }
    return POLL_IDLE_MS;
  }

  /* ---------- Auth & API ---------- */
  const AUTH_RELOAD_COOLDOWN_MS = 15000;
  const AUTH_RELOAD_TS_KEY = "__fp_auth_reload_at__";

  function getAuthToken() {
    let stored = "";
    try { stored = sessionStorage.getItem("__fp_hud_token__") || ""; } catch (_) {}
    return String(window.__FP_HUD_TOKEN__ || stored || urlParams.get("token") || "").trim();
  }

  function tryAuthRecoveryReload() {
    if (hasWebViewBridge()) return false;
    const now = Date.now();
    let lastReloadAt = 0;
    try {
      lastReloadAt = Number(sessionStorage.getItem(AUTH_RELOAD_TS_KEY) || "0") || 0;
    } catch (_) {
      return false;
    }
    if (lastReloadAt > 0 && (now - lastReloadAt) < AUTH_RELOAD_COOLDOWN_MS) {
      return false;
    }
    try {
      sessionStorage.setItem(AUTH_RELOAD_TS_KEY, String(now));
      sessionStorage.removeItem("__fp_hud_token__");
    } catch (_) {
      return false;
    }
    if (isHudMode && window.location.pathname === "/ui.html") {
      window.location.replace(`/${window.location.search || "?mode=hud"}`);
    } else {
      window.location.reload();
    }
    return true;
  }

  async function apiFetch(path, options = {}) {
    const headers = new Headers(options.headers || {});
    if (options.method && options.method.toUpperCase() !== "GET") {
      headers.set("Content-Type", "application/json");
    }
    const tok = getAuthToken();
    if (tok) {
      headers.set("X-Flow-Pilot-Token", tok);
    }
    const resp = await fetch(path, { ...options, headers, cache: "no-store" });
    const text = await resp.text();
    let json = {};
    try { json = text ? JSON.parse(text) : {}; } catch (_) { json = { raw: text }; }
    if (!resp.ok) {
      const err = new Error(json.error || json.message || `HTTP ${resp.status}`);
      err.status = resp.status;
      err.data = json;
      throw err;
    }
    return json;
  }

  /* ---------- Native Host Window Bridge ---------- */
  const hasWebViewBridge = () => Boolean(window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === "function");
  let lastSentSize = { w: 0, h: 0, anchor: "", mode: "", idleOpen: false };
  let resizeRafId = 0;
  let moveSaveTimer = null;
  let userResizeSaveTimer = null;

  function postNativeCmd(payload) {
    if (!isHudMode) return false;
    if (hasWebViewBridge()) {
      try {
        window.chrome.webview.postMessage(JSON.stringify(payload));
        return true;
      } catch (_) {}
    }
    return false;
  }

  let resizeListenersBound = false;
  function detachNativeResizeListeners() {
    if (!resizeListenersBound) return;
    resizeListenersBound = false;
    window.removeEventListener("mouseup", onNativeResizeMouseUp);
    window.removeEventListener("mousemove", onNativeResizeMouseMove);
  }

  function clearIdleNativeResizeFlag() {
    if (nativeResizeGuardTimer) {
      clearTimeout(nativeResizeGuardTimer);
      nativeResizeGuardTimer = null;
    }
    detachNativeResizeListeners();
    isUserNativeResizing = false;
    activeResizeEdge = "";
  }

  function onNativeResizeMouseUp() {
    if (isUserNativeResizing) setTimeout(clearIdleNativeResizeFlag, 120);
  }

  function onNativeResizeMouseMove(ev) {
    if (isUserNativeResizing && typeof ev.buttons === "number" && (ev.buttons & 1) === 0) {
      clearIdleNativeResizeFlag();
    }
  }

  function attachNativeResizeListeners() {
    if (resizeListenersBound || !isHudMode) return;
    resizeListenersBound = true;
    window.addEventListener("mouseup", onNativeResizeMouseUp);
    window.addEventListener("mousemove", onNativeResizeMouseMove);
  }

  const HostWindowBridge = {
    dragMove() { postNativeCmd({ cmd: "dragMove" }); },
    startResize(edge) {
      if (!isHudMode || !edge) return;
      isUserNativeResizing = true;
      activeResizeEdge = String(edge).toLowerCase();
      attachNativeResizeListeners();
      if (nativeResizeGuardTimer) clearTimeout(nativeResizeGuardTimer);
      nativeResizeGuardTimer = setTimeout(clearIdleNativeResizeFlag, 12000);
      postNativeCmd({ cmd: "startResize", edge: activeResizeEdge });
    },
    resize(width, height, anchorCorner, extra = {}) {
      if (!isHudMode || isUserNativeResizing) return;
      const w = Math.round(width), h = Math.round(height);
      const rawAnchor = anchorCorner || hudPrefs.anchorCorner || "top-right";
      const anchor = String(rawAnchor).endsWith("left") ? "top-left" : "top-right";
      const idleOpenFlag = Boolean(extra.idleOpen);

      if (
        lastSentSize.w === w &&
        lastSentSize.h === h &&
        lastSentSize.anchor === anchor &&
        lastSentSize.mode === hudPrefs.viewMode &&
        lastSentSize.idleOpen === idleOpenFlag
      ) {
        return;
      }

      const sent = postNativeCmd({
        cmd: "resize",
        width: w,
        height: h,
        anchorCorner: anchor,
        viewMode: hudPrefs.viewMode,
        lockTop: extra.lockTop !== false,
        idleOpen: idleOpenFlag,
        minHeight: extra.minHeight || HUD_STACK_MIN_H,
      });

      if (sent) {
        lastSentSize = { w, h, anchor, mode: hudPrefs.viewMode, idleOpen: idleOpenFlag };
        el("capsuleUnit").style.width = "";
        el("capsuleUnit").style.height = "";
      } else if (!hasWebViewBridge()) {
        lastSentSize = { w, h, anchor, mode: hudPrefs.viewMode, idleOpen: idleOpenFlag };
        el("capsuleUnit").style.width = `${w}px`;
        el("capsuleUnit").style.height = `${h}px`;
        try { window.resizeTo(w, h); } catch (_) {}
      }
    },
    setTopMost(alwaysOnTop) { postNativeCmd({ cmd: "setTopMost", alwaysOnTop: Boolean(alwaysOnTop) }); },
    close() {
      if (!postNativeCmd({ cmd: "close" })) {
        try { window.close(); } catch (_) {}
      }
    },
  };

  function playFlashAnimation() {
    const target = el("capsuleUnit");
    if (!target) return;
    target.classList.remove("flash-highlight");
    void target.offsetWidth;
    target.classList.add("flash-highlight");
    setTimeout(() => target.classList.remove("flash-highlight"), 1700);
  }

  function syncHostWorkArea(msg) {
    if (!msg || typeof msg !== "object") return false;
    if (typeof msg.availBelowCssPx !== "number" && typeof msg.workBottom !== "number" && typeof msg.workHeight !== "number") {
      return false;
    }
    const prev = (window.__FP_WORK_AREA__ && typeof window.__FP_WORK_AREA__ === "object") ? window.__FP_WORK_AREA__ : {};
    const prevAvail = prev.availBelowCssPx;
    const prevDpi = prev.dpi;
    const next = { ...prev };
    for (const k of [
      "workLeft", "workTop", "workRight", "workBottom", "workWidth", "workHeight",
      "winX", "winY", "physX", "physY", "physTop", "physWorkBottom", "dpi", "scale", "availBelowCssPx",
    ]) {
      if (typeof msg[k] === "number" && Number.isFinite(msg[k])) next[k] = msg[k];

    const dpiChanged = typeof next.dpi === "number" && next.dpi !== prevDpi;
    if (dpiChanged) {

    }
    return next.availBelowCssPx !== prevAvail || dpiChanged;
  }

  const isValidHudCoord = (v) => typeof v === "number" && Number.isFinite(v) && v > -10000 && v < 30000;
  const isValidPhysCoord = (v) => typeof v === "number" && Number.isFinite(v) && v > -16000 && v < 32768;

  function handleHostIncomingMessage(rawMsg) {
    let msg = rawMsg;
    if (typeof msg === "string") {
      try { msg = JSON.parse(msg); } catch (_) { return; }
    }
    if (!msg || typeof msg !== "object") return;
    const evtName = msg.event || msg.type || msg.cmd || "";

    if (evtName === "workArea") {
      syncHostWorkArea(msg);
      if (isValidHudCoord(msg.winX)) hudPrefs.x = Math.round(msg.winX);
      if (isValidHudCoord(msg.winY)) hudPrefs.y = Math.round(msg.winY);
      if (isValidPhysCoord(msg.physX)) hudPrefs.physX = Math.round(msg.physX);
      if (isValidPhysCoord(msg.physY)) hudPrefs.physY = Math.round(msg.physY);
      scheduleHudResize();
    } else if (evtName === "moved") {
      const availChanged = syncHostWorkArea(msg);
      const hasValidX = isValidHudCoord(msg.x);
      const hasValidY = isValidHudCoord(msg.y);
      const hasValidPhysX = isValidPhysCoord(msg.physX);
      const hasValidPhysY = isValidPhysCoord(msg.physY);
      if (hasValidX) hudPrefs.x = Math.round(msg.x);
      if (hasValidY) hudPrefs.y = Math.round(msg.y);
      if (hasValidPhysX) hudPrefs.physX = Math.round(msg.physX);
      if (hasValidPhysY) hudPrefs.physY = Math.round(msg.physY);
      if (typeof msg.anchorCorner === "string" && msg.anchorCorner) hudPrefs.anchorCorner = msg.anchorCorner;
      prefsDirtyUntil = Date.now() + 1600;
      if (hudPrefs.viewMode === "stack" && availChanged) scheduleHudResize();
      if (hasValidX || hasValidY || hasValidPhysX || hasValidPhysY) {
        if (moveSaveTimer) clearTimeout(moveSaveTimer);
        moveSaveTimer = setTimeout(() => {
          moveSaveTimer = null;
          const patch = { anchorCorner: hudPrefs.anchorCorner };
          if (isValidHudCoord(hudPrefs.x)) patch.x = hudPrefs.x;
          if (isValidHudCoord(hudPrefs.y)) patch.y = hudPrefs.y;
          if (isValidPhysCoord(hudPrefs.physX)) patch.physX = hudPrefs.physX;
          if (isValidPhysCoord(hudPrefs.physY)) patch.physY = hudPrefs.physY;
          if ("x" in patch || "y" in patch || "physX" in patch || "physY" in patch) saveHudPrefs(patch);
        }, 450);
      }
    } else if (evtName === "resizeCancelled") {
      clearIdleNativeResizeFlag();
      scheduleHudResize();
    } else if (evtName === "resetAutoHeight") {
      resetCustomHeight();
    } else if (evtName === "userResized") {
      const usedEdge = String(msg.edge || activeResizeEdge || "").toLowerCase();
      clearIdleNativeResizeFlag();
      syncHostWorkArea(msg);

      if (typeof msg.width === "number" && msg.width >= 200) {
        hudPrefs.width = clamp(Math.round(msg.width), HUD_MIN_WIDTH, HUD_MAX_WIDTH);
      }
      if (isValidHudCoord(msg.x)) hudPrefs.x = Math.round(msg.x);
      if (isValidHudCoord(msg.y)) hudPrefs.y = Math.round(msg.y);
      if (isValidPhysCoord(msg.physX)) hudPrefs.physX = Math.round(msg.physX);
      if (isValidPhysCoord(msg.physY)) hudPrefs.physY = Math.round(msg.physY);
      if (typeof msg.anchorCorner === "string" && msg.anchorCorner) {
        hudPrefs.anchorCorner = msg.anchorCorner.endsWith("left") ? "top-left" : "top-right";
      }

      if (msg.customHeight === null) {
        hudPrefs.customHeight = null;
      } else if (hudPrefs.viewMode === "stack" && typeof msg.height === "number" && msg.height >= HUD_STACK_MIN_H) {
        const hRounded = clamp(Math.round(msg.height), HUD_STACK_MIN_H, HUD_CUSTOM_MAX_H);
        const isVerticalInteractiveEdge = usedEdge.includes("n") || usedEdge.includes("s");
        const heightDidChange = msg.heightChanged !== false;
        if (isVerticalInteractiveEdge && heightDidChange && Math.abs(hRounded - lastAutoComputedHeight) >= 4) {
          hudPrefs.customHeight = hRounded;
        }
      }

      const finalH = hudPrefs.viewMode === "pill"
        ? HUD_PILL_HEIGHT
        : (hudPrefs.customHeight != null ? hudPrefs.customHeight : Math.round(num(msg.height, lastAutoComputedHeight)));
      lastSentSize = {
        w: hudPrefs.width,
        h: finalH,
        anchor: hudPrefs.anchorCorner || "top-right",
        mode: hudPrefs.viewMode,
        idleOpen: Boolean(idleDrawerOpen),
      };
      if (!hasWebViewBridge() && isHudMode) {
        el("capsuleUnit").style.width = `${hudPrefs.width}px`;
        if (hudPrefs.viewMode === "stack" && hudPrefs.customHeight != null) {
          el("capsuleUnit").style.height = `${hudPrefs.customHeight}px`;
        }
      }

      prefsDirtyUntil = Date.now() + 1800;
      syncSettingControlsUI();
      lastSentSize.w = 0;
      scheduleHudResize();

      if (userResizeSaveTimer) clearTimeout(userResizeSaveTimer);
      userResizeSaveTimer = setTimeout(() => {
        userResizeSaveTimer = null;
        const patch = {
          width: hudPrefs.width,
          customHeight: hudPrefs.customHeight,
          anchorCorner: hudPrefs.anchorCorner,
        };
        if (isValidHudCoord(hudPrefs.x)) patch.x = hudPrefs.x;
        if (isValidHudCoord(hudPrefs.y)) patch.y = hudPrefs.y;
        if (isValidPhysCoord(hudPrefs.physX)) patch.physX = hudPrefs.physX;
        if (isValidPhysCoord(hudPrefs.physY)) patch.physY = hudPrefs.physY;
        saveHudPrefs(patch);
      }, 360);
    } else if (evtName === "flash") {
      playFlashAnimation();
    }
  }

  if (hasWebViewBridge() && typeof window.chrome.webview.addEventListener === "function") {
    window.chrome.webview.addEventListener("message", (ev) => handleHostIncomingMessage(ev && ev.data));
  }
  if (isHudMode) {
    window.addEventListener("message", (ev) => handleHostIncomingMessage(ev && ev.data));
  }

  /* ---------- Light-Only Appearance & Opacity ---------- */
  let lastAppliedAlpha = "";
  function applyAppearance() {
    const alphaStr = (isHudMode ? clamp(Number(hudPrefs.opacity) || 0.97, 0.72, 1) : 1).toFixed(2);
    if (alphaStr !== lastAppliedAlpha) {
      lastAppliedAlpha = alphaStr;
      document.documentElement.style.setProperty("--fp-win-alpha", alphaStr);
    }
  }

  /* ---------- Embedded Host Bridge ---------- */
  if (!isHudMode) {
    window.addEventListener("message", (event) => {
      const data = event && event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "conversation-change") {
        const nextCid = (data.payload && data.payload.conversationId) ?? data.conversationId ?? "";
        if (typeof nextCid === "string" && nextCid.trim() !== hostConversationId) {
          hostConversationId = nextCid.trim();
          fastPollBoostUntil = Date.now() + 2500;
          if (lastFullPayload) renderMultiTasks(lastFullPayload, { localOnlyPrefs: true });
          pollNow(true);
        }
      }
    });

    if (window.parent && window.parent !== window) {
      const PURE_MODIFIER_KEYS = new Set(["Control", "Meta", "Alt", "Shift", "AltGraph"]);
      const EDITABLE_NAV_KEYS = new Set(["arrowleft", "arrowright", "arrowup", "arrowdown", "home", "end"]);
      const NON_TEXT_INPUT_TYPES = new Set(["button", "checkbox", "color", "file", "hidden", "image", "radio", "range", "reset", "submit"]);
      const forwardedKeyIds = new Set();

      const isContentEditable = (target) => {
        if (!target || typeof target !== "object") return false;
        if (target.isContentEditable) return true;
        if (typeof target.closest !== "function") return false;
        const ce = target.closest("[contenteditable]");
        return Boolean(ce && ce.getAttribute("contenteditable") !== "false");
      };

      const isEditableTarget = (target) => {
        if (!target || typeof target !== "object") return false;
        const tag = typeof target.tagName === "string" ? target.tagName.toUpperCase() : "";
        if (tag === "TEXTAREA" || tag === "SELECT") return !target.disabled && !target.readOnly;
        if (tag === "INPUT") {
          const inputType = typeof target.type === "string" ? target.type.toLowerCase() : "text";
          return !NON_TEXT_INPUT_TYPES.has(inputType) && !target.disabled && !target.readOnly;
        }
        if (isContentEditable(target)) return true;
        if (typeof target.closest === "function") {
          const textbox = target.closest('[role="textbox"]');
          if (textbox && textbox.getAttribute("aria-disabled") !== "true") return true;
        }
        return false;
      };

      const isNativeClipboardChord = (e, keyLower) =>
        (e.ctrlKey || e.metaKey) && !e.altKey && ((!e.shiftKey && (keyLower === "c" || keyLower === "x")) || keyLower === "v");

      const isEditableTextChord = (e, keyLower) => {
        if (!e.ctrlKey && !e.metaKey && (!e.altKey || (typeof e.key === "string" && e.key.length <= 1))) return true;
        if (EDITABLE_NAV_KEYS.has(keyLower)) return true;
        if (!e.shiftKey && (keyLower === "backspace" || keyLower === "delete")) return true;
        if ((e.ctrlKey || e.metaKey) && !e.altKey && ((!e.shiftKey && (keyLower === "a" || keyLower === "y")) || keyLower === "z")) return true;
        return false;
      };

      const isRichTextFormattingChord = (e, keyLower) =>
        (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (keyLower === "b" || keyLower === "i" || keyLower === "u");

      const shouldForwardKeyDown = (e) => {
        if (e.defaultPrevented || e.isComposing || e.keyCode === 229) return false;
        if (typeof e.key !== "string" || PURE_MODIFIER_KEYS.has(e.key)) return false;
        if (!e.ctrlKey && !e.metaKey && !e.altKey) return false;
        if (typeof e.getModifierState === "function" && e.getModifierState("AltGraph")) return false;
        const keyLower = e.key.toLowerCase();
        if (isNativeClipboardChord(e, keyLower)) return false;
        const rawTarget = (typeof e.composedPath === "function" && e.composedPath()[0]) || e.target;
        if (isEditableTarget(rawTarget) && isEditableTextChord(e, keyLower)) return false;
        if (isContentEditable(rawTarget) && isRichTextFormattingChord(e, keyLower)) return false;
        return true;
      };

      const getKeyTrackingId = (e) => e.code || (typeof e.key === "string" ? e.key.toLowerCase() : "");

      const postKeyEvent = (e) => {
        window.parent.postMessage({
          type: "sidecar-key-event",
          payload: {
            eventType: e.type,
            key: e.key,
            code: e.code || "",
            ctrlKey: Boolean(e.ctrlKey),
            metaKey: Boolean(e.metaKey),
            altKey: Boolean(e.altKey),
            shiftKey: Boolean(e.shiftKey),
            repeat: Boolean(e.repeat),
          },
        }, "*");
      };

      window.addEventListener("keydown", (e) => {
        if (!shouldForwardKeyDown(e)) return;
        const trackingId = getKeyTrackingId(e);
        if (trackingId) forwardedKeyIds.add(trackingId);
        postKeyEvent(e);
      });

      window.addEventListener("keyup", (e) => {
        if (e.isComposing || e.keyCode === 229 || typeof e.key !== "string") return;
        const trackingId = getKeyTrackingId(e);
        const wasForwarded = trackingId && forwardedKeyIds.delete(trackingId);
        if (wasForwarded || (forwardedKeyIds.size > 0 && e.key === "Meta")) {
          if (e.key === "Meta") forwardedKeyIds.clear();
          postKeyEvent(e);
        }
      });

      window.addEventListener("blur", () => {
        forwardedKeyIds.clear();
      });
    }
  }

  /* ---------- HUD Equal-Width True Full-Content Auto-Fit Engine ---------- */
  function getAvailableBelowCssPx() {
    if (typeof window.availBelowCssPx === "number" && Number.isFinite(window.availBelowCssPx) && window.availBelowCssPx > 0) {
      return Math.max(HUD_STACK_MIN_H, Math.floor(window.availBelowCssPx));
    }
    if (typeof window.__FP_AVAIL_BELOW_CSS_PX__ === "number" && Number.isFinite(window.__FP_AVAIL_BELOW_CSS_PX__) && window.__FP_AVAIL_BELOW_CSS_PX__ > 0) {
      return Math.max(HUD_STACK_MIN_H, Math.floor(window.__FP_AVAIL_BELOW_CSS_PX__));
    }
    const wa = window.__FP_WORK_AREA__;
    if (wa && typeof wa === "object") {
      if (typeof wa.availBelowCssPx === "number" && Number.isFinite(wa.availBelowCssPx) && wa.availBelowCssPx > 0) {
        return Math.max(HUD_STACK_MIN_H, Math.floor(wa.availBelowCssPx));
      }
      if (typeof wa.workBottom === "number" && Number.isFinite(wa.workBottom)) {
        const topY = typeof wa.winY === "number"
          ? wa.winY
          : (typeof hudPrefs.y === "number" ? hudPrefs.y : (wa.workTop || 0) + 16);
        return Math.max(HUD_STACK_MIN_H, Math.floor(wa.workBottom - topY) - 6);
      }
    }

    const qAvail = urlParams.get("availBelowCssPx");
    if (qAvail !== null && qAvail !== "" && Number.isFinite(Number(qAvail)) && Number(qAvail) > 0) {
      return Math.max(HUD_STACK_MIN_H, Math.floor(Number(qAvail)));
    }

    const screenAvailH = (window.screen && typeof window.screen.availHeight === "number") ? window.screen.availHeight : 0;
    const screenAvailTop = (window.screen && typeof window.screen.availTop === "number") ? window.screen.availTop : 0;
    if (hasWebViewBridge()) {
      if (screenAvailH > 0) {
        if (typeof hudPrefs.y === "number" && hudPrefs.y >= screenAvailTop && hudPrefs.y < screenAvailTop + screenAvailH - HUD_STACK_MIN_H) {
          return Math.max(HUD_STACK_MIN_H, Math.floor(screenAvailTop + screenAvailH - hudPrefs.y) - 6);
        }
        return Math.max(HUD_STACK_MIN_H, Math.floor(screenAvailH - 24));
      }
      return 1056;
    }

    const viewportH = typeof window.innerHeight === "number" ? window.innerHeight : 0;
    const previewAvailH = Math.max(screenAvailH, viewportH);
    return Math.max(HUD_STACK_MIN_H, Math.floor((previewAvailH > 0 ? previewAvailH : 1080) - 24));
  }

  function measureBlockOuterH(node, fallback = 0) {
    if (!node) return fallback;
    const rectH = node.getBoundingClientRect ? node.getBoundingClientRect().height : 0;
    const rawH = Math.max(rectH, node.offsetHeight || 0);
    return rawH > 0 ? Math.ceil(rawH) : fallback;
  }

  function measureNaturalScrollBoxH(node) {
    if (!node) return 0;
    const borderH = Math.max(0, (node.offsetHeight || 0) - (node.clientHeight || 0));
    const scrollH = (node.scrollHeight || 0) + borderH;
    const rectH = node.getBoundingClientRect ? node.getBoundingClientRect().height : 0;
    return Math.ceil(Math.max(scrollH, node.style.maxHeight && node.style.maxHeight !== "none" ? 0 : rectH));
  }

  function computeIntrinsicHudSize() {
    const targetW = clamp(Math.round(num(hudPrefs.width, HUD_DEFAULT_WIDTH)), HUD_MIN_WIDTH, HUD_MAX_WIDTH);
    const capsuleEl = el("capsuleUnit");
    if (isHudMode && !hasWebViewBridge()) {
      capsuleEl.style.width = `${targetW}px`;
    }

    if (hudPrefs.viewMode === "pill") {
      if (isHudMode && !hasWebViewBridge()) {
        capsuleEl.style.height = "";
      }
      return {
        width: targetW,
        height: HUD_PILL_HEIGHT,
        lockTop: true,
        idleOpen: false,
        minHeight: HUD_PILL_HEIGHT,
      };
    }

    const stackScrollEl = el("stackScroll");
    const stackListEl = el("stackList");
    const setDrawerEl = el("settingsDrawer");
    const idleFooterEl = el("idleFooter");
    const idleToggleEl = el("idleToggleBtn");
    const idleListEl = el("idleList");

    const shellBorderH = 2;
    const pillH = measureBlockOuterH(el("pillShell"), 34);
    const setNaturalH = settingsOpen ? measureNaturalScrollBoxH(setDrawerEl) : 0;
    const hasActiveCards = stackScrollEl.style.display !== "none" && stackListEl.children.length > 0;
    const listNaturalH = hasActiveCards ? Math.max(48, measureNaturalScrollBoxH(stackListEl)) : 0;
    const idleVisible = idleFooterEl.classList.contains("visible");
    const idleBarVisible = idleVisible && idleToggleEl.style.display !== "none";
    const idleBarH = idleBarVisible ? measureBlockOuterH(idleToggleEl, 28) : 0;
    const isIdleListOpen = idleVisible && idleListEl.classList.contains("open");
    const idleListNaturalH = isIdleListOpen ? measureNaturalScrollBoxH(idleListEl) : 0;

    const naturalTotalH = Math.max(
      HUD_STACK_MIN_H,
      Math.ceil(shellBorderH + pillH + setNaturalH + listNaturalH + idleBarH + idleListNaturalH + HUD_DPI_SUBPIXEL_PAD)
    );

    const availScreenMaxH = getAvailableBelowCssPx();
    const isManualH = typeof hudPrefs.customHeight === "number" && hudPrefs.customHeight >= HUD_STACK_MIN_H;
    const autoTargetH = Math.min(naturalTotalH, availScreenMaxH);
    lastAutoComputedHeight = autoTargetH;

    const targetH = isManualH
      ? clamp(Math.round(hudPrefs.customHeight), HUD_STACK_MIN_H, Math.min(HUD_CUSTOM_MAX_H, availScreenMaxH))
      : autoTargetH;

    const needsScrollCap = naturalTotalH > targetH;

    capsuleEl.classList.toggle("manual-height", isManualH);
    capsuleEl.classList.toggle("scroll-capped", needsScrollCap);

    if (!needsScrollCap) {
      setDrawerEl.style.maxHeight = "none";
      setDrawerEl.style.overflowY = "hidden";
      if (setDrawerEl.scrollTop !== 0) setDrawerEl.scrollTop = 0;

      idleListEl.style.maxHeight = "none";
      idleListEl.style.overflowY = "hidden";
      if (idleListEl.scrollTop !== 0) idleListEl.scrollTop = 0;

      if (stackScrollEl.scrollTop !== 0) stackScrollEl.scrollTop = 0;
    } else {
      const fixedBarsH = shellBorderH + pillH + idleBarH;
      const middleBudget = Math.max(32, targetH - fixedBarsH);
      const minActiveScrollH = hasActiveCards
        ? Math.min(listNaturalH, Math.max(56, Math.min(108, Math.floor(middleBudget * 0.42))))
        : 0;

      if (setNaturalH + idleListNaturalH + minActiveScrollH <= middleBudget) {
        setDrawerEl.style.maxHeight = "none";
        setDrawerEl.style.overflowY = "hidden";
        idleListEl.style.maxHeight = "none";
        idleListEl.style.overflowY = "hidden";
      } else {
        const drawerBudget = Math.max(0, middleBudget - minActiveScrollH);
        if (settingsOpen && isIdleListOpen) {
          const setShare = Math.max(48, Math.min(setNaturalH, Math.floor(drawerBudget * 0.56)));
          const idleShare = Math.max(40, Math.min(idleListNaturalH, Math.max(40, drawerBudget - setShare)));
          setDrawerEl.style.maxHeight = `${setShare}px`;
          setDrawerEl.style.overflowY = setNaturalH > setShare ? "auto" : "hidden";
          idleListEl.style.maxHeight = `${idleShare}px`;
          idleListEl.style.overflowY = idleListNaturalH > idleShare ? "auto" : "hidden";
        } else if (settingsOpen) {
          const setCap = Math.max(48, drawerBudget);
          setDrawerEl.style.maxHeight = `${setCap}px`;
          setDrawerEl.style.overflowY = setNaturalH > setCap ? "auto" : "hidden";
          idleListEl.style.maxHeight = "none";
          idleListEl.style.overflowY = "hidden";
        } else if (isIdleListOpen) {
          setDrawerEl.style.maxHeight = "none";
          setDrawerEl.style.overflowY = "hidden";
          const idleCap = Math.max(40, drawerBudget);
          idleListEl.style.maxHeight = `${idleCap}px`;
          idleListEl.style.overflowY = idleListNaturalH > idleCap ? "auto" : "hidden";
        }
      }
    }

    const minGuaranteeH = Math.min(
      availScreenMaxH,
      Math.max(HUD_STACK_MIN_H, shellBorderH + pillH + (hasActiveCards ? Math.min(listNaturalH, 96) : 0) + idleBarH)
    );

    return {
      width: targetW,
      height: targetH,
      naturalHeight: naturalTotalH,
      availBelowCssPx: availScreenMaxH,
      capped: needsScrollCap,
      lockTop: true,
      idleOpen: Boolean(hasActiveCards && idleDrawerOpen),
      minHeight: Math.ceil(minGuaranteeH),
    };
  }

  function scheduleHudResize() {
    if (!isHudMode || isUserNativeResizing) return;
    if (resizeRafId) cancelAnimationFrame(resizeRafId);
    resizeRafId = requestAnimationFrame(() => {
      resizeRafId = 0;
      if (isUserNativeResizing) return;
      const sz = computeIntrinsicHudSize();
      HostWindowBridge.resize(sz.width, sz.height, hudPrefs.anchorCorner, {
        lockTop: sz.lockTop,
        idleOpen: sz.idleOpen,
        minHeight: sz.minHeight,
      });
    });
  }

  function resetCustomHeight() {
    clearIdleNativeResizeFlag();
    hudPrefs.customHeight = null;
    el("capsuleUnit").classList.remove("manual-height");
    lastSentSize = { w: 0, h: 0, anchor: "", mode: "", idleOpen: false };
    saveHudPrefs({ customHeight: null }, "reset_auto_height");
    scheduleHudResize();
  }

  if (isHudMode) {
    window.addEventListener("resize", () => {
      if (!isUserNativeResizing && hudPrefs.viewMode === "stack") scheduleHudResize();
    });
    window.__FP_RECOMPUTE_HUD_SIZE__ = () => {
      const sz = computeIntrinsicHudSize();
      HostWindowBridge.resize(sz.width, sz.height, hudPrefs.anchorCorner, {
        lockTop: sz.lockTop,
        idleOpen: sz.idleOpen,
        minHeight: sz.minHeight,
      });
      return sz;
    };
  }

  if (isHudMode && typeof ResizeObserver === "function") {
    const ro = new ResizeObserver(() => {
      if (!isUserNativeResizing && settingsOpen && hudPrefs.viewMode === "stack" && !document.hidden) {
        scheduleHudResize();
      }
    });
    ro.observe(el("settingsDrawer"));
  }

  /* ---------- Bind 8-Way Resize Handles & Unified Pill Interactions ---------- */
  let lastResizeEdgeDownAt = 0;
  let lastResizeEdgeDownName = "";
  el("resizeLayer").querySelectorAll("[data-resize-edge]").forEach((handleEl) => {
    const edge = handleEl.getAttribute("data-resize-edge") || "";
    const isVerticalResetEdge = ["n", "s", "se", "sw"].includes(edge);
    handleEl.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const now = Date.now();
      if (isVerticalResetEdge && (e.detail >= 2 || (lastResizeEdgeDownName === edge && now - lastResizeEdgeDownAt < 360))) {
        lastResizeEdgeDownAt = 0;
        lastResizeEdgeDownName = "";
        resetCustomHeight();
        return;
      }
      lastResizeEdgeDownAt = now;
      lastResizeEdgeDownName = edge;
      HostWindowBridge.startResize(edge);
    });
    if (isVerticalResetEdge) {
      handleEl.addEventListener("dblclick", (e) => {
        e.preventDefault();
        e.stopPropagation();
        resetCustomHeight();
      });
    }
  });

  function syncExpansionStateAfterUserAction() {
    el("settingsDrawer").classList.toggle("open", settingsOpen);
    el("pillSettingsBtn").classList.toggle("active", settingsOpen);
    if (lastFullPayload) {
      renderMultiTasks(lastFullPayload, { localOnlyPrefs: true });
      if (lastPayloadCompact && !shouldRequestCompact()) {
        pollNow(true);
      }
      return;
    }
    const shouldExpand = Boolean(settingsOpen);
    if (isHudMode) {
      const nextVm = shouldExpand ? "stack" : "pill";
      if (hudPrefs.viewMode !== nextVm) {
        hudPrefs.viewMode = nextVm;
        lastSentSize = { w: 0, h: 0, anchor: "", mode: "", idleOpen: false };
        if (nextVm === "stack") stackDomDirty = false;
        saveHudPrefs({ viewMode: nextVm });
      }
      el("capsuleUnit").classList.toggle("expanded", shouldExpand);
      if (!shouldExpand && !hasWebViewBridge()) el("capsuleUnit").style.height = "";
      scheduleHudResize();
    } else {
      embedCollapsed = !shouldExpand;
      el("capsuleUnit").classList.toggle("expanded", shouldExpand);
    }
    if (lastPayloadCompact && !shouldRequestCompact()) {
      pollNow(true);
    }
  }

  function toggleCapsuleExpandCollapse() {
    const cu = el("capsuleUnit");
    if (cu && cu.classList.contains("expanded")) {
      settingsOpen = false;
      if (lastHasActiveCards) manualActiveCollapsed = true;
      else manualIdleExpanded = false;
    } else {
      if (lastHasActiveCards) manualActiveCollapsed = false;
      else if (lastIdleCandidates.length > 0 || lastTotalIdleCount > 0) manualIdleExpanded = true;
      else return;
    }
    syncExpansionStateAfterUserAction();
  }

  (function bindPillInteractions() {
    const pillEl = el("pillShell");
    if (!pillEl) return;
    let lastMouseUpHandledAt = 0;
    let lastDragTriggeredAt = 0;

    if (isHudMode) {
      pillEl.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        if (e.target instanceof Element && e.target.closest("[data-no-drag]")) return;
        const downX = e.screenX, downY = e.screenY;
        let dragged = false;
        const cleanup = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
        };
        const onMove = (ev) => {
          if ((ev.buttons & 1) === 0) { cleanup(); return; }
          if (Math.hypot(ev.screenX - downX, ev.screenY - downY) >= 4) {
            dragged = true;
            lastDragTriggeredAt = Date.now();
            cleanup();
            HostWindowBridge.dragMove();
          }
        };
        const onUp = (ev) => {
          cleanup();
          if (ev.button === 0 && !dragged && Math.hypot(ev.screenX - downX, ev.screenY - downY) < 4) {
            if (!(ev.target instanceof Element && ev.target.closest("[data-no-drag]"))) {
              lastMouseUpHandledAt = Date.now();
              toggleCapsuleExpandCollapse();
            }
          }
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      });
    }

    pillEl.addEventListener("click", (e) => {
      if (e.target instanceof Element && e.target.closest("[data-no-drag]")) return;
      if (isHudMode) {
        if (Date.now() - lastMouseUpHandledAt < 250 || Date.now() - lastDragTriggeredAt < 400) return;
      }
      toggleCapsuleExpandCollapse();
    });
  })();

  /* ---------- Telemetry Normalization Layer ---------- */
  function normSpeed(sp) {
    const o = sp && typeof sp === "object" ? sp : {};
    const active = Boolean(o.active);
    const phase = typeof o.phase === "string" && o.phase ? o.phase : (active ? "generating" : "idle");
    const avg = num(o.avgTokensPerSec, 0);
    const peak = num(o.peakTokensPerSec, 0);
    const disp = num(o.displayTokensPerSec, avg);
    const live = active && phase !== "waiting_ttft" ? num(o.liveTokensPerSec !== undefined ? o.liveTokensPerSec : disp, disp) : 0;
    const out = Math.round(num(o.outputTokens, 0));
    const think = Math.round(num(o.thinkingTokens, 0));
    const resp = Math.round(num(o.responseTokens, 0));
    const elapsedGenSec = num(o.elapsedGenSec, 0);
    const hasHistory = !active && (avg > 0 || disp > 0 || out > 0);
    const phaseLabel = (typeof o.phaseLabel === "string" && o.phaseLabel.trim()) ||
      (phase === "waiting_ttft" ? "等待首字" : phase === "thinking" ? "思考中" : active ? "输出中" : (hasHistory ? "已完成" : "空闲"));
    return {
      active, phase, phaseLabel,
      displayTokensPerSec: disp, liveTokensPerSec: live, avgTokensPerSec: avg, peakTokensPerSec: peak,
      outputTokens: out, thinkingTokens: think, responseTokens: resp,
      elapsedGenSec,
      isExact: Boolean(o.isExact), ttftMs: Math.round(num(o.ttftMs, 0)), hasHistory,
    };
  }

  function normSubTokenUsage(raw) {
    const o = raw && typeof raw === "object" ? raw : {};
    const inputTokens = Math.round(num(o.inputTokens, 0));
    const cacheReadTokens = Math.round(num(o.cacheReadTokens, 0));
    const outputTokens = Math.round(num(o.outputTokens, 0));
    const netTokens = o.netTokens !== undefined ? Math.round(num(o.netTokens, 0)) : (inputTokens + outputTokens);
    const denom = inputTokens + cacheReadTokens;
    const hasCacheData = o.hasCacheData !== undefined ? Boolean(o.hasCacheData) : denom > 0;
    const cacheHitPct = o.cacheHitPct !== undefined
      ? num(o.cacheHitPct, 0)
      : (denom > 0 ? Math.round((cacheReadTokens / denom) * 1000) / 10 : 0);
    const lastTurnCacheTokens = Math.round(num(o.lastTurnCacheTokens, 0));
    const lastTurnInputTokens = Math.round(num(o.lastTurnInputTokens, 0));
    const lastTurnDenom = lastTurnInputTokens + lastTurnCacheTokens;
    const lastTurnTotalTokens = o.lastTurnTotalTokens !== undefined
      ? Math.round(num(o.lastTurnTotalTokens, 0))
      : lastTurnDenom;
    const rawLastPct = optNum(o.lastTurnCacheHitPct);
    const lastTurnCacheHitPct = rawLastPct !== null
      ? rawLastPct
      : (o.lastTurnCacheHitPct === null
        ? null
        : (lastTurnDenom > 0 ? Math.round((lastTurnCacheTokens / lastTurnDenom) * 1000) / 10 : null));
    const cacheMissStreak = Math.round(num(o.cacheMissStreak, 0));
    return {
      netTokens, inputTokens, cacheReadTokens, outputTokens, cacheHitPct, hasCacheData,
      lastTurnCacheHitPct, lastTurnCacheTokens, lastTurnInputTokens, lastTurnTotalTokens, cacheMissStreak,
    };
  }

  function normTokenUsage(raw) {
    const o = raw && typeof raw === "object" ? raw : {};
    const base = normSubTokenUsage(o);
    const grossTokens = o.grossTokens !== undefined
      ? Math.round(num(o.grossTokens, 0))
      : (base.inputTokens + base.cacheReadTokens + base.outputTokens);
    return {
      ...base,
      grossTokens,
      thinkingTokens: Math.round(num(o.thinkingTokens, 0)),
      responseTokens: Math.round(num(o.responseTokens, 0)),
      subNetTokens: Math.round(num(o.subNetTokens, 0)),
      subCacheReadTokens: Math.round(num(o.subCacheReadTokens, 0)),
      subCount: Math.round(num(o.subCount, 0)),
      turnCount: Math.round(num(o.turnCount, 0)),
    };
  }

  function clearTimerPrefix(prefix) {
    for (const k of Array.from(timerRegistry.keys())) {
      if (k.startsWith(prefix)) timerRegistry.delete(k);
    }
  }

  function normalizeTask(raw, nowSec, pinnedSet) {
    const d = raw && typeof raw === "object" ? raw : {};
    const cid = String(d.conversationId || "").trim();
    const lsId = String(d.lsInstanceId || "local").trim();
    const taskKey = String(d.taskKey || `${lsId}:${cid}`);
    const ctx = d.context || d.contextWindowUsage || {};
    const grp = ctx.groups || {};
    const used = num(ctx.used, 0);
    const max = num(ctx.max, 512000) || 512000;
    const rawPct = ctx.percent !== undefined ? num(ctx.percent, 0) : (max > 0 ? (used / max) * 100 : 0);
    const pct = (used > max && max > 0) ? Math.max(rawPct, (used / max) * 100) : Math.max(0, rawPct);

    const hb = d.heartbeat || {};
    const ra = hb.retryAlert;
    const raObj = ra && typeof ra === "object" ? ra : null;
    const alertMsg = typeof ra === "string"
      ? ra.trim()
      : (raObj && typeof raObj.message === "string" ? raObj.message.trim() : "");
    const retryAlert = (raObj || alertMsg)
      ? {
          attempt: Math.round(num(raObj && raObj.attempt, 0)),
          consecutiveErrors: Math.round(num(raObj && raObj.consecutiveErrors, 0)),
          isTimeout: Boolean(raObj && raObj.isTimeout),
          isInterrupted: Boolean(raObj && raObj.isInterrupted),
          isServerRestart: Boolean(raObj && raObj.isServerRestart),
          ageSec: optNum(raObj && raObj.ageSec),
          message: alertMsg,
        }
      : null;

    const rawSubs = Array.isArray(d.activeSubagents) ? d.activeSubagents : [];
    const subs = rawSubs
      .filter((s) => s && typeof s === "object" && (
        s.agentKind !== "swarm_monitor" ||
        s.hasError ||
        s.running ||
        String(s.state || "").toLowerCase() === "running" ||
        s.isStalled
      ))
      .map((s) => {
        const sState = String(s.state || (s.running ? "running" : "waiting")).toLowerCase();
        const sErr = Boolean(s.hasError || sState === "error");
        const sRunning = s.running !== false && sState === "running" && !sErr;
        const subUsed = num(s.context && s.context.used, 0);
        const subMax = num(s.context && s.context.max, 512000) || 512000;
        const subRawPct = s.context && s.context.percent !== undefined ? num(s.context.percent, 0) : (subMax > 0 ? (subUsed / subMax) * 100 : 0);
        const sRawBg = s.bgScript && typeof s.bgScript === "object" ? s.bgScript : null;
        const sBgIdx = sRawBg ? optNum(sRawBg.stepIndex) : null;
        const sBgScript = sRawBg
          ? {
              kind: String(sRawBg.kind || "command"),
              toolName: String(sRawBg.toolName || "").replace(/^CORTEX_STEP_TYPE_/i, ""),
              stepIndex: sBgIdx !== null ? Math.round(sBgIdx) : null,
              startedAt: num(sRawBg.startedAt, 0),
              elapsedSec: num(sRawBg.elapsedSec, 0),
              logUri: String(sRawBg.logUri || ""),
              isStalled: Boolean(sRawBg.isStalled),
            }
          : null;
        return {
          conversationId: String(s.conversationId || ""),
          agentKind: String(s.agentKind || "subagent"),
          name: String(s.name || shortCid(s.conversationId) || "子代理"),
          modelLabel: String(s.modelLabel || "Auto"),
          state: sErr ? "error" : (sRunning ? "running" : "waiting"),
          running: sRunning,
          hasError: sErr,
          isStalled: Boolean(s.isStalled),
          runningStepIndex: typeof s.runningStepIndex === "number" ? Math.round(s.runningStepIndex) : -1,
          currentTool: String(s.currentTool || (sRunning ? "执行中" : "")).replace(/^CORTEX_STEP_TYPE_/i, ""),
          stepCount: Math.round(num(s.stepCount, 0)),
          elapsedSec: num(s.elapsedSec, 0),
          errorReason: String(s.errorReason || ""),
          bgScript: sBgScript,
          context: {
            used: subUsed,
            max: subMax,
            percent: (subUsed > subMax && subMax > 0) ? Math.max(subRawPct, (subUsed / subMax) * 100) : Math.max(0, subRawPct),
          },
          tokenSpeed: normSpeed(s.tokenSpeed),
          tokenUsage: normSubTokenUsage(s.tokenUsage),
        };
      });

    const rawSwarm = d.swarmSummary && typeof d.swarmSummary === "object" ? d.swarmSummary : {};
    let calcSubRun = 0, calcSubWait = 0, calcSubErr = 0, subLiveSum = 0;
    let calcSubWaitingTtft = false, calcSubAnyGenerating = false;
    for (const s of subs) {
      if (s.running) calcSubRun++;
      else if (s.hasError) calcSubErr++;
      else calcSubWait++;
      if (s.running && s.tokenSpeed.active && s.tokenSpeed.phase !== "waiting_ttft") {
        subLiveSum += s.tokenSpeed.displayTokensPerSec;
        calcSubAnyGenerating = true;
      }
      if (s.running && s.tokenSpeed.active && s.tokenSpeed.phase === "waiting_ttft") calcSubWaitingTtft = true;
    }
    const calcSubLiveTps = Math.round(subLiveSum * 10) / 10;

    const swarmSummary = {
      isSwarm: rawSwarm.isSwarm !== undefined
        ? Boolean(rawSwarm.isSwarm)
        : Boolean(subs.some((s) => s.agentKind === "swarm_worker") || subs.length >= 3),
      runningCount: calcSubRun,
      waitingCount: calcSubWait,
      errorCount: calcSubErr,
      totalCount: subs.length,
      liveTokensPerSec: rawSwarm.liveTokensPerSec !== undefined ? num(rawSwarm.liveTokensPerSec, calcSubLiveTps) : calcSubLiveTps,
      anyWaitingTtft: rawSwarm.anyWaitingTtft !== undefined ? Boolean(rawSwarm.anyWaitingTtft) : calcSubWaitingTtft,
      anyGenerating: rawSwarm.anyGenerating !== undefined ? Boolean(rawSwarm.anyGenerating) : calcSubAnyGenerating,
    };

    const rawBg = hb.bgScript && typeof hb.bgScript === "object" ? hb.bgScript : null;
    const rawBgStepIdx = rawBg ? optNum(rawBg.stepIndex) : null;
    const bgScript = rawBg
      ? {
          kind: String(rawBg.kind || "command"),
          toolName: String(rawBg.toolName || "").replace(/^CORTEX_STEP_TYPE_/i, ""),
          stepIndex: rawBgStepIdx !== null ? Math.round(rawBgStepIdx) : null,
          startedAt: num(rawBg.startedAt, 0),
          elapsedSec: num(rawBg.elapsedSec, 0),
          logUri: String(rawBg.logUri || ""),
          isStalled: Boolean(rawBg.isStalled),
        }
      : null;

    const tokenSpeed = normSpeed(d.tokenSpeed);
    const hbStateLower = String(hb.state || "idle").toLowerCase();
    const isServerRestartAlert = Boolean(raObj && raObj.isServerRestart);
    const hasHbAlert = !isServerRestartAlert && (
      Boolean(alertMsg) ||
      Boolean(retryAlert && (retryAlert.isTimeout || retryAlert.isInterrupted || retryAlert.attempt > 0 || retryAlert.consecutiveErrors > 0)) ||
      ["interrupted", "retrying", "error"].includes(hbStateLower) ||
      hb.stateLabel === "断流待续" || hb.stateLabel === "重试告警" || hb.stateLabel === "超时中断" || hb.stateLabel === "异常中断"
    );

    let bucket = String(d.bucket || d.tier || "").toUpperCase();
    if (!["ALERT", "RUNNING", "RECENT", "IDLE"].includes(bucket)) {
      if (hasHbAlert || Boolean(hb.isStalled) || swarmSummary.errorCount > 0) bucket = "ALERT";
      else if (Boolean(hb.isRunning) || hbStateLower === "running_bg_script" || hbStateLower === "waiting_approval" || tokenSpeed.active || swarmSummary.runningCount > 0 || String(d.status || "").toUpperCase() === "RUNNING") bucket = "RUNNING";
      else if (d.justFinishedAt && (nowSec - num(d.justFinishedAt, 0)) <= 180) bucket = "RECENT";
      else bucket = "IDLE";
    }
    if (bucket === "IDLE" && (hasHbAlert || Boolean(hb.isStalled) || swarmSummary.errorCount > 0)) bucket = "ALERT";

    const justFinishedAt = num(d.justFinishedAt, 0);
    const rawTopChildren = Array.isArray(ctx.topChildren) ? ctx.topChildren : [];
    const topChildren = rawTopChildren
      .filter((c) => c && typeof c === "object" && num(c.tokens, 0) > 0 && String(c.name || "").trim())
      .slice(0, 6)
      .map((c) => ({
        group: String(c.group || "").trim(),
        name: String(c.name || "").trim(),
        tokens: Math.round(num(c.tokens, 0)),
      }));
    const estimatedAfterCompaction = Boolean(ctx.estimatedAfterCompaction);
    const routedModelLabel = String(d.routedModelLabel || "").trim();
    return {
      taskKey, lsInstanceId: lsId, cid,
      title: String(d.title || `会话 ${shortCid(cid)}`),
      workspaceName: String(d.workspaceName || ""),
      branchName: String(d.branchName || ""),
      modelLabel: String(d.modelLabel || "Auto").trim() || "Auto",
      routedModelLabel,
      bucket,
      isPinned: Boolean(d.isPinned || pinnedSet.has(cid)),
      runBatchStartedAt: num(d.runBatchStartedAt, 0),
      justFinishedAt,
      finishedAgoSec: justFinishedAt > 0 ? Math.max(0, nowSec - justFinishedAt) : 0,
      lastModifiedAt: num(d.lastModifiedAt, 0),
      used, max, pct,
      groups: { sys: num(grp.systemPrompt, 0), ext: num(grp.extensions, 0), tools: num(grp.tools, 0), chat: num(grp.chatMessages, 0) },
      compactionCount: Math.max(0, Math.round(num(ctx.compactionCount, 0))),
      estimatedAfterCompaction,
      topChildren,
      anyGenerating: d.anyGenerating !== undefined
        ? Boolean(d.anyGenerating)
        : Boolean((tokenSpeed.active && tokenSpeed.phase !== "waiting_ttft") || swarmSummary.anyGenerating),
      tokenSpeed,
      tokenUsage: normTokenUsage(d.tokenUsage),
      hb: {
        state: String(hb.state || "idle"),
        stateLabel: String(hb.stateLabel || ""),
        isRunning: Boolean(hb.isRunning),
        isStalled: Boolean(hb.isStalled),
        hasAlert: hasHbAlert,
        retryAlert,
        stepIndex: Math.round(num(hb.stepIndex, 0)),
        runningStepIndex: typeof hb.runningStepIndex === "number" ? hb.runningStepIndex : -1,
        toolName: String(hb.toolName || "").replace(/^CORTEX_STEP_TYPE_/i, ""),
        elapsedSec: num(hb.elapsedSec, 0),
        alertMsg,
        bgScript,
      },
      swarmSummary,
      subs,
    };
  }

  /* ---------- Badge & Drawer Builders ---------- */
  const SHORT_TOOL_ALIASES = {
    run_command: "run_cmd",
    call_mcp_tool: "mcp_tool",
    fast_io_batch_read: "batch_read",
    fast_io_grep: "io_grep",
    fast_io_glob_tree: "io_glob",
    fast_io_outline: "io_outline",
    invoke_subagent: "subagent",
    command_status: "cmd_stat",
  };
  function fmtShortToolName(raw) {
    const s = String(raw || "").trim();
    if (!s || s === "执行中") return "执行中";
    const mapped = SHORT_TOOL_ALIASES[s.toLowerCase()] || s;
    return mapped.length > 10 ? mapped.slice(0, 9) + "…" : mapped;
  }
  function isActiveFgRootTool(task) {
    if (!task || !task.hb || !task.hb.isRunning || task.hb.runningStepIndex < 0) return false;
    const tn = String(task.hb.toolName || "").trim().toLowerCase();
    return tn !== "invoke_subagent" && tn !== "swarm_wait";
  }

  function applySwarmHeaderSpeedBadge(node, liveRate, waitingTtft, anyGenerating = false, runningCount = 0) {
    node.className = "speed-badge";
    if (liveRate > 0) {
      node.classList.add("active");
      setTextIfChanged(node, `⚡ ${fmtRate(liveRate)} tok/s`);
    } else if (waitingTtft) {
      node.classList.add("waiting");
      setTextIfChanged(node, "⚡ 等待首字");
    } else if (anyGenerating) {
      node.classList.add("waiting");
      setTextIfChanged(node, "⚡ 生成中");
    } else if (runningCount > 0) {
      node.classList.add("waiting-sub");
      setTextIfChanged(node, "⚙ 执行中");
    } else {
      node.classList.add("empty");
      setTextIfChanged(node, "⚡ 0.0 tok/s");
    }
  }

  function applyCardRow2Speed(node, task) {
    const ts = task.tokenSpeed;
    const hbState = String((task.hb && task.hb.state) || "").toLowerCase();
    node.className = "speed-badge";
    if (ts.active) {
      const rate = ts.displayTokensPerSec;
      if (rate <= 0) {
        node.classList.add("waiting");
        const phaseLbl = ts.phase === "waiting_ttft" ? "等待首字" : (ts.phaseLabel || "生成中");
        const waitLabel = ts.elapsedGenSec >= 5
          ? `⚡ ${phaseLbl} ${fmtElapsed(ts.elapsedGenSec)} ▾`
          : `⚡ ${phaseLbl} ▾`;
        setTextIfChanged(node, waitLabel);
      } else {
        node.classList.add("active");
        setTextIfChanged(node, `⚡ ${fmtRate(rate)} tok/s ▾`);
      }
      return;
    }
    if (hbState === "waiting_approval") {
      node.classList.add("waiting-sub");
      setTextIfChanged(node, "⏸ 等待审批 ▾");
      return;
    }
    if (isActiveFgRootTool(task)) {
      node.classList.add("waiting-sub");
      const shortTool = fmtShortToolName(task.hb.toolName);
      const elSec = num(task.hb.elapsedSec, 0);
      setTextIfChanged(node, elSec >= 1 ? `⚙ ${shortTool} ${fmtElapsed(elSec)} ▾` : `⚙ ${shortTool} ▾`);
      return;
    }
    if (task.swarmSummary.runningCount > 0) {
      node.classList.add("waiting-sub");
      setTextIfChanged(node, "⏸ 等待子代理 ▾");
      return;
    }
    const bgScript = task.hb && task.hb.bgScript;
    if (hbState === "running_bg_script" && bgScript) {
      node.classList.add("waiting-sub");
      const bgPrefix = bgScript.kind === "workflow" ? "⚙ 工作流" : "⚙ 后台脚本";
      const bgElapsed = bgScript.startedAt > 0 ? Math.max(0, (Date.now() / 1000) - bgScript.startedAt) : bgScript.elapsedSec;
      setTextIfChanged(node, bgElapsed >= 1 ? `${bgPrefix} ${fmtElapsed(bgElapsed)} ▾` : `${bgPrefix} ▾`);
      return;
    }
    if (task.hb && task.hb.isRunning) {
      node.classList.add("waiting-sub");
      setTextIfChanged(node, "⚙ 执行中 ▾");
      return;
    }
    const histRate = ts.avgTokensPerSec > 0 ? ts.avgTokensPerSec : ts.displayTokensPerSec;
    if (ts.hasHistory && histRate > 0) {
      node.classList.add("history");
      setTextIfChanged(node, `${fmtRate(histRate)} tok/s ▾`);
    } else {
      node.classList.add("empty");
      setTextIfChanged(node, "-- tok/s");
    }
  }

  function applySubBeeSpeedBadge(node, sub) {
    const ts = sub.tokenSpeed;
    const histRate = ts.avgTokensPerSec > 0 ? ts.avgTokensPerSec : ts.displayTokensPerSec;
    node.className = "speed-badge";
    if (sub.running && ts.active) {
      node.style.display = "inline-flex";
      const liveRate = ts.displayTokensPerSec;
      if (liveRate <= 0) {
        node.classList.add("waiting");
        const phaseLbl = ts.phase === "waiting_ttft" ? "等待首字" : (ts.phaseLabel || "生成中");
        const waitLabel = ts.elapsedGenSec >= 5
          ? `⚡ ${phaseLbl} ${fmtElapsed(ts.elapsedGenSec)}`
          : `⚡ ${phaseLbl}`;
        setTextIfChanged(node, waitLabel);
      } else {
        node.classList.add("active");
        setTextIfChanged(node, `⚡ ${fmtRate(liveRate)} tok/s`);
      }
      return;
    }
    if (histRate > 0) {
      node.style.display = "inline-flex";
      node.classList.add("history");
      setTextIfChanged(node, `${fmtRate(histRate)} tok/s`);
      return;
